          "</button>" +
          "</main>";

        $("#btn-volver").onclick = () =>
          editando ? abrirDetalle(f.grupo) : ir("agenda");
        $("#f-cliente").oninput = (e) => {
          f.cliente = e.target.value;
        };
        $("#f-tel").oninput = (e) => {
          f.telefono = e.target.value;
        };
        $("#f-nota").oninput = (e) => {
          f.nota = e.target.value;
        };

        v.querySelectorAll("[data-unidad]").forEach(
          (b) =>
            (b.onclick = () => {
              const u = b.dataset.unidad;
              if (f.unidades.includes(u))
                f.unidades = f.unidades.filter((x) => x !== u);
              else f.unidades.push(u);
              f.unidades.sort(
                (a, c) => UNIDADES.indexOf(a) - UNIDADES.indexOf(c),
              );
              b.setAttribute("aria-pressed", f.unidades.includes(u));
              if (b.dataset.padre) {
                const n = f.unidades.filter((x) =>
                  x.startsWith(b.dataset.padre + " · "),
                ).length;
                const cuenta = v.querySelector(
                  '[data-cuenta="' + b.dataset.padre + '"]',
                );
                cuenta.textContent = n;
                cuenta.hidden = !n;
              }
              pintarHoras();
            }),
        );

        if (!editando)
          v.querySelectorAll("#f-estado button").forEach(
            (b) =>
              (b.onclick = () => {
                f.estado = b.dataset.valor;
                v.querySelectorAll("#f-estado button").forEach((x) =>
                  x.setAttribute("aria-pressed", x === b),
                );
              }),
          );
        $("#f-fecha").onchange = (e) => {
          if (e.target.value && e.target.value < hoy()) {
            aviso("No se puede agendar en fechas pasadas.", true);
            e.target.value = f.fecha >= hoy() ? f.fecha : hoy();
          }
          f.fecha = e.target.value;
          f.hora_inicio = "";
          cargarOcupadas();
        };
        $("#f-guardar").onclick = guardarCita;
        cargarOcupadas();
      }

      async function cargarOcupadas() {
        const f = E.form;
        if (!f.fecha) {
          f.ocupadas = {};
          f.ocupadasFecha = null;
          return pintarHoras();
        }
        const fechaConsultada = f.fecha;
        const ocupadas = {};
        try {
          (await citasDelDia(fechaConsultada)).forEach((c) => {
            if ((c.grupo || c.id) !== f.grupo)
              ocupadas[hhmm(c.hora_inicio)] = true;
          });
        } catch (e) {
          aviso("No se pudo revisar la disponibilidad.", true);
        }
        if (E.vista !== "nueva" || E.form !== f || f.fecha !== fechaConsultada)
          return;
        f.ocupadas = ocupadas;
        f.ocupadasFecha = fechaConsultada;
        pintarHoras();
      }

      // ¿Se pueden reservar n turnos seguidos empezando en el turno i?
      function cabeDesde(i, n, ocupadas) {
        for (let k = 0; k < n; k++) {
          const h = CONFIG.horarios[i + k];
          if (!h || ocupadas[h[0]]) return false;
          if (k > 0 && CONFIG.horarios[i + k - 1][1] !== h[0]) return false;
        }
        return true;
      }

      function pintarHoras() {
        const f = E.form,
          caja = $("#f-horas"),
          resumen = $("#f-resumen");
        if (!caja) return;
        if (!f.fecha) {
          caja.innerHTML =
            '<div class="texto-suave" style="grid-column:1/-1">Elige una fecha.</div>';
          resumen.hidden = true;
          return;
        }
        if (f.ocupadasFecha !== f.fecha) return;
        if (f.fecha < hoy()) {
          caja.innerHTML =
            '<div class="texto-suave" style="grid-column:1/-1">No se puede agendar en fechas pasadas. Elige hoy o un día futuro.</div>';
          f.hora_inicio = "";
          resumen.hidden = true;
          return;
        }

        const n = Math.max(1, Math.min(f.unidades.length, maxTurnos())),
          oc = f.ocupadas;
        $("#f-horas-rotulo").textContent =
          n > 1
            ? "Hora de inicio (se reservan " + n + " turnos seguidos)"
            : "Hora de inicio";

        const iSel = CONFIG.horarios.findIndex((h) => h[0] === f.hora_inicio);
        if (
          iSel < 0 ||
          !cabeDesde(iSel, n, oc) ||
          yaPaso(f.fecha, f.hora_inicio)
        )
          f.hora_inicio = "";

        caja.innerHTML = CONFIG.horarios
          .map((h, i) => {
            const ocupado = !!oc[h[0]],
              cabe = cabeDesde(i, n, oc),
              pasado = yaPaso(f.fecha, h[0]);
            let attrs = "";
            if (pasado)
              attrs =
                ' disabled class="opcion corto" aria-label="' +
                hora(h[0]) +
                ': ya pasó"';
            else if (ocupado)
              attrs = ' disabled aria-label="' + hora(h[0]) + ' ocupado"';
            else if (!cabe)
              attrs =
                ' disabled class="opcion corto" aria-label="' +
                hora(h[0]) +
                ': no alcanzan los turnos seguidos"';
            return (
              '<button type="button"' +
              (attrs.includes("class=") ? "" : ' class="opcion"') +
              ' data-hora="' +
              h[0] +
              '"' +
              attrs +
              ' aria-pressed="' +
              (f.hora_inicio === h[0]) +
              '">' +
              hora(h[0]) +
              "</button>"
            );
          })
          .join("");

        if (
          f.fecha === hoy() &&
          CONFIG.horarios.every((h) => yaPaso(f.fecha, h[0]))
        ) {
          caja.innerHTML =
            '<div class="texto-suave" style="grid-column:1/-1">Ya pasaron todos los turnos de hoy. Elige otro día.</div>';
        }
        caja.querySelectorAll("[data-hora]").forEach(
          (b) =>
            (b.onclick = () => {
              f.hora_inicio = b.dataset.hora;
              caja
                .querySelectorAll("[data-hora]")
                .forEach((x) => x.setAttribute("aria-pressed", x === b));
              pintarResumenTurno();
            }),
        );
        pintarResumenTurno();
      }

      function turnosElegidos() {
        const f = E.form,
          i = CONFIG.horarios.findIndex((h) => h[0] === f.hora_inicio);
        if (i < 0) return [];
        const n = Math.min(f.unidades.length, maxTurnos());
        return repartir(f.unidades, n).map((grupo, k) => ({
          servicio: grupo.join(" + "),
          ini: CONFIG.horarios[i + k][0],
          fin: CONFIG.horarios[i + k][1],
        }));
      }

      function pintarResumenTurno() {
        const f = E.form,
          r = $("#f-resumen");
        if (!r) return;
        const t = turnosElegidos();
        if (!t.length) {
          r.hidden = true;
          return;
        }
        const ini = t[0].ini,
          fin = t[t.length - 1].fin;
        const tipo =
          t.length === 1
            ? "Turno simple"
            : t.length === 2
              ? "Turno doble"
              : t.length + " turnos seguidos";
        r.textContent =
          tipo +
          ": " +
          hora(ini) +
          " – " +
          hora(fin) +
          " (" +
          duracionTexto(ini, fin) +
          ")" +
          (t.length > 1
            ? "\n" +
              t
                .map((x) => hora(x.ini) + " " + textoTurno(x.servicio))
                .join(" · ")
            : "");
        r.style.whiteSpace = "pre-line";
        r.hidden = false;
      }

      async function guardarCita() {
        const f = E.form,
          btn = $("#f-guardar");
        if (!f.cliente.trim())
          return aviso("Escribe el nombre de la clienta.", true);
        if (!f.unidades.length)
          return aviso("Elige al menos un servicio.", true);
        if (!f.fecha) return aviso("Elige la fecha.", true);
        if (!f.hora_inicio)
          return aviso("Elige una hora de inicio libre.", true);
        if (yaPaso(f.fecha, f.hora_inicio)) {
          aviso("Esa hora ya pasó. Elige otra.", true);
          f.hora_inicio = "";
          return pintarHoras();
        }

        const turnos = turnosElegidos();
        const grupo = f.grupo || nuevoId();
        const estado = f.original ? f.original.estado : f.estado;
        const confirmado =
          estado === "confirmada"
            ? (f.original && f.original.confirmado_en) ||
              new Date().toISOString()
            : null;

        const filas = turnos.map((t) => ({
          grupo: grupo,
          cliente: f.cliente.trim(),
          telefono: f.telefono.trim() || null,
          servicio: t.servicio,
          fecha: f.fecha,
          hora_inicio: t.ini,
          hora_fin: t.fin,
          estado: estado,
          nota: f.nota.trim() || null,
          confirmado_en: confirmado,
        }));

        btn.setAttribute("aria-busy", "true");
        let res;
        if (f.grupo) {
          filas.forEach((x) => {
            x.creado_en = f.original ? f.original.creado_en : null;
          });
          res = await db.rpc("reemplazar_grupo", {
            p_grupo: grupo,
            p_filas: filas,
          });
        } else {
          res = await db.from("citas").insert(filas).select();
        }
        btn.removeAttribute("aria-busy");

        if (res.error) {
          if (res.error.code === "23505") {
            aviso(
              "Uno de esos horarios se acaba de ocupar. Elige otra hora.",
              true,
            );
            cargarOcupadas();
          } else aviso("No se pudo guardar. Intenta otra vez.", true);
          return;
        }
        E.fecha = f.fecha;
        E.inicioTira = sumarDias(f.fecha, -1);
        aviso(
          f.grupo
            ? "Cambios guardados"
            : "Cita guardada. Ahora envíale el mensaje por WhatsApp.",
        );
        E.reserva = armarGrupo(res.data);
        ir("detalle");
      }

      /* =====================================================================
   Vista: Detalle de la reserva
   ===================================================================== */
      async function abrirDetalle(grupo) {
        try {
          E.reserva = await reservaPorGrupo(grupo);
        } catch (e) {
          return aviso("No se pudo abrir la cita.", true);
        }
        ir("detalle");
      }

      function pintarDetalle() {
        const g = E.reserva,
          v = $("#vista");
        if (!g) return ir("agenda");
        const esPend = g.estado === "pendiente",
          cancelada = g.estado === "cancelada";
        const texto = esPend ? msgAbono(g) : msgConfirmada(g);
        const pasada = g.fecha < hoy();
        const etiqueta = cancelada
          ? '<span class="etiqueta vencida">Cancelada</span>'
          : '<span class="etiqueta ' +
            (esPend ? "pend" : "conf") +
            '">' +
            (esPend ? "Pendiente de pago" : "Confirmada") +
            "</span>";

        v.innerHTML =
          '<header class="barra-titulo"><button type="button" class="btn-redondo" id="btn-volver" aria-label="Volver a la agenda">' +
          ICONO_ATRAS +
          "</button><h1>Detalle de cita</h1></header>" +
          '<main class="contenido">' +
          '<section class="ficha">' +
          '<div class="ficha-cab"><div><b>' +
          esc(g.cliente) +
          '</b><span class="texto-suave">' +
          esc(g.telefono || "Sin teléfono") +
          "</span></div>" +
          etiqueta +
          "</div>" +
          '<div class="datos">' +
          "<div><span>Fecha</span><b>" +
          fechaCorta(g.fecha) +
          "</b></div>" +
          "<div><span>Horario</span><b>" +
          hora(g.inicio) +
          " – " +
          hora(g.fin) +
          "</b></div>" +
          "<div><span>Turnos</span><b>" +
          g.filas.length +
          (g.filas.length === 1 ? " turno" : " turnos") +
          " · " +
          duracionTexto(g.inicio, g.fin) +
          "</b></div>" +
          "<div><span>Abono</span><b>$" +
          CONFIG.abono +
          (esPend ? " · por recibir" : cancelada ? "" : " · recibido") +
          "</b></div>" +
          "</div>" +
          '<div class="turnos-grupo">' +
          g.filas
            .map(
              (x) =>
                "<div><b>" +
                hora(x.hora_inicio) +
                " – " +
                hora(x.hora_fin) +
                "</b><span>" +
                esc(textoTurno(x.servicio)) +
                "</span></div>",
            )
            .join("") +
          "</div>" +
          (g.nota
            ? '<p class="texto-suave">Nota: ' + esc(g.nota) + "</p>"
            : "") +
          (esPend
            ? '<p class="texto-suave">Reservada ' +
              transcurrido(g.creado_en).toLowerCase() +
              ".</p>"
            : "") +
          "</section>" +
          (cancelada
            ? '<p class="texto-suave">Esta reserva está cancelada y sus horarios quedaron libres.</p>'
            : '<section class="columna">' +
              '<span class="texto-suave" style="font-weight:600;font-size:12px">' +
              (esPend
                ? "Mensaje con los datos del abono"
                : "Mensaje de confirmación") +
              "</span>" +
              '<div class="burbuja">' +
              esc(texto) +
              "</div>" +
              "</section>" +
              '<section class="columna">' +
              (esPend
                ? '<button type="button" class="btn btn-principal btn-grande" id="d-confirmar">Confirmar abono recibido</button>'
                : '<button type="button" class="btn btn-borde btn-grande" id="d-pendiente">Volver a pendiente</button>') +
              (g.telefono
                ? '<a class="btn btn-grande" href="' +
                  esc(linkWa(g.telefono, texto)) +
                  '" target="_blank" rel="noopener">' +
                  ICONO_WA +
                  (esPend ? "Enviar datos del abono" : "Enviar confirmación") +
                  "</a>" +
                  (!esPend && !pasada
                    ? '<a class="btn btn-grande" href="' +
                      esc(linkWa(g.telefono, msgRecordatorio(g))) +
                      '" target="_blank" rel="noopener">' +
                      ICONO_WA +
                      "Enviar recordatorio</a>"
                    : "")
                : '<p class="texto-suave">Agrega un número de WhatsApp (en Reprogramar) para enviarle mensajes.</p>') +
              '<div class="acciones">' +
              '<button type="button" class="btn" id="d-editar">Reprogramar</button>' +
              '<button type="button" class="btn btn-peligro" id="d-cancelar">Cancelar cita</button>' +
              "</div>" +
              "</section>") +
          "</main>";

        $("#btn-volver").onclick = () => {
          E.fecha = g.fecha;
          E.inicioTira = sumarDias(g.fecha, -1);
          ir("agenda");
        };
        if (cancelada) return;

        const recargar = async () => {
          try {
            E.reserva = await reservaPorGrupo(g.grupo);
          } catch (e) {}
          pintarDetalle();
          actualizarInsignia();
        };
        if (esPend) {
          $("#d-confirmar").onclick = async (e) => {
            const b = e.currentTarget;
            b.setAttribute("aria-busy", "true");
            if (await cambiarEstado(g.grupo, "confirmada")) {
              aviso("¡Cita confirmada! Envíale la confirmación.");
              recargar();
            } else b.removeAttribute("aria-busy");
          };
        } else {
          $("#d-pendiente").onclick = async () => {
            if (await cambiarEstado(g.grupo, "pendiente")) recargar();
          };
        }
        $("#d-editar").onclick = () =>
          ir("nueva", {
            grupo: g.grupo,
            cliente: g.cliente,
            telefono: g.telefono || "",
            unidades: g.servicios.filter((s) => UNIDADES.includes(s)),
            fecha: g.fecha,
            hora_inicio: g.inicio,
            estado: g.estado,
            nota: g.nota || "",
            original: {
              estado: g.estado,
              creado_en: g.creado_en,
              confirmado_en: g.confirmado_en,
            },
          });
        $("#d-cancelar").onclick = async () => {
          if (
            !confirm(
              "¿Cancelar la cita de " +
                g.cliente +
                "? " +
                (g.filas.length > 1
                  ? "Sus " + g.filas.length + " turnos quedarán libres."
                  : "El horario quedará libre."),
            )
          )
            return;
          if (await cambiarEstado(g.grupo, "cancelada")) {
            aviso("Cita cancelada");
            E.fecha = g.fecha;
            ir("agenda");
          }
        };
      }

      /* =====================================================================
   Vista: Avisos (notificaciones push)
   ===================================================================== */
      function urlBase64AUint8(s) {
        const p = "=".repeat((4 - (s.length % 4)) % 4);
        const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/"));
        return Uint8Array.from(b, (c) => c.charCodeAt(0));
      }
      function esIPhone() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }
      function esInstalada() {
        return (
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true
        );
      }
      async function registroSW() {
        if (!("serviceWorker" in navigator)) return null;
        try {
          await navigator.serviceWorker.register("sw.js");
          return await Promise.race([
            navigator.serviceWorker.ready,
            new Promise((r) => setTimeout(() => r(null), 6000)),
          ]);
        } catch (e) {
          return null;
        }
      }

      async function pintarAvisos() {
        const v = $("#vista");
        v.innerHTML =
          '<header class="barra-titulo"><button type="button" class="btn-redondo" id="btn-volver" aria-label="Volver a la agenda">' +
          ICONO_ATRAS +
          "</button><h1>Avisos</h1></header>" +
          '<main class="contenido">' +
          '<section class="ficha">' +
          '<p style="margin:0">Te llega una notificación <b>' +
          (CONFIG.minutosAviso || 15) +
          " minutos antes</b> de cada cita <b>confirmada</b>, aunque la agenda esté cerrada.</p>" +
          '<p class="nota-turno" id="av-estado">Revisando este celular…</p>' +
          "</section>" +
          '<section class="columna">' +
          '<button type="button" class="btn btn-principal btn-grande" id="av-activar" hidden>Activar avisos en este celular</button>' +
          '<button type="button" class="btn btn-grande" id="av-probar" hidden>Enviar aviso de prueba</button>' +
          '<button type="button" class="btn btn-peligro btn-grande" id="av-quitar" hidden>Desactivar en este celular</button>' +
          "</section>" +
          "</main>";
        $("#btn-volver").onclick = () => ir("agenda");

        const estado = $("#av-estado");
        const mostrarError = (txt) => {
          estado.textContent = txt;
          estado.style.background = "var(--alerta-fondo)";
          estado.style.color = "var(--alerta)";
        };
        const mostrar = (txt, botones) => {
          estado.textContent = txt;
          ["activar", "probar", "quitar"].forEach((b) => {
            $("#av-" + b).hidden = !(botones || []).includes(b);
          });
        };

        if (!CONFIG.VAPID_PUBLIC)
          return mostrar(
            "Los avisos todavía no están configurados para esta agenda.",
          );
        if (esIPhone() && !esInstalada())
          return mostrar(
            'En iPhone, primero instala la agenda: en Safari toca Compartir → "Agregar a inicio", y ábrela desde ese ícono. Luego vuelve aquí.',
          );
        if (
          !("serviceWorker" in navigator) ||
          !("PushManager" in window) ||
          !("Notification" in window)
        )
          return mostrar(
            "Este navegador no permite notificaciones. Usa Chrome en Android o la agenda instalada en iPhone.",
          );
        if (Notification.permission === "denied")
          return mostrar(
            "Las notificaciones están bloqueadas para la agenda. Actívalas en los ajustes del celular (Notificaciones) y vuelve a entrar aquí.",
          );

        const reg = await registroSW();
        if (E.vista !== "avisos") return;
        if (!reg)
          return mostrar(
            "No se pudo preparar el celular para recibir avisos. Recarga la página e intenta de nuevo.",
          );

        const sub = await reg.pushManager.getSubscription();
        if (sub && Notification.permission === "granted") {
          // Por si se borró de la base de datos, la vuelve a guardar
          guardarSuscripcion(sub);
          mostrar("Avisos activos en este celular.", ["probar", "quitar"]);
        } else {
          mostrar("Los avisos están desactivados en este celular.", [
            "activar",
          ]);
        }

        $("#av-activar").onclick = async (e) => {
          const b = e.currentTarget;
          b.setAttribute("aria-busy", "true");
          const permiso = await Notification.requestPermission();
          if (permiso !== "granted") {
            b.removeAttribute("aria-busy");
            return pintarAvisos();
          }

          // 1) Revisa que la clave pública del config.js tenga el formato correcto
          let clave;
          try {
            clave = urlBase64AUint8(String(CONFIG.VAPID_PUBLIC).trim());
          } catch (_) {
            clave = null;
          }
          if (!clave || clave.length !== 65 || clave[0] !== 4) {
            b.removeAttribute("aria-busy");
            return mostrarError(
              "La clave VAPID_PUBLIC del config.js no es válida. Debe ser la clave pública (empieza con B y tiene unos 87 caracteres), sin espacios.",
            );
          }

          // 2) Registra el celular en el servicio de notificaciones
          let s;
          try {
            s = await reg.pushManager.getSubscription();
            if (s && !mismaClave(s, clave)) {
              await s.unsubscribe();
              s = null;
            } // registro viejo con otra clave
            if (!s)
              s = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: clave,
              });
          } catch (err) {
            b.removeAttribute("aria-busy");
            return mostrarError(
              "El celular no pudo registrarse para notificaciones (" +
                (err.name || "Error") +
                ": " +
                (err.message || err) +
                "). " +
                "Revisa que estés usando Chrome, que Chrome tenga permiso de notificaciones en los ajustes del celular y que tenga conexión a internet.",
            );
          }

          // 3) Guarda el registro en Supabase
          const r = await guardarSuscripcion(s);
          b.removeAttribute("aria-busy");
          if (!r.ok) {
            return mostrarError(
              "El celular se registró, pero no se pudo guardar en Supabase (" +
                r.error +
                "). " +
                "Revisa que hayas ejecutado el script 1-avisos.sql en este proyecto.",
            );
          }
          aviso("Avisos activados. Envía una prueba para comprobar.");
          pintarAvisos();
        };

        $("#av-probar").onclick = async (e) => {
          const b = e.currentTarget;
          b.setAttribute("aria-busy", "true");
          const { data, error } = await db.functions.invoke("avisos", {
            body: { prueba: true },
          });
          b.removeAttribute("aria-busy");
          if (error)
            aviso(
              'No se pudo enviar la prueba. Revisa que la función "avisos" esté instalada.',
              true,
            );
          else if (!data || !data.enviados)
            aviso("No hay celulares activados para recibir avisos.", true);
          else aviso("Prueba enviada. Debe llegarte en unos segundos.");
        };

        $("#av-quitar").onclick = async () => {
          const s = await reg.pushManager.getSubscription();
          if (s) {
            await db.from("suscripciones").delete().eq("endpoint", s.endpoint);
            await s.unsubscribe();
          }
          aviso("Avisos desactivados en este celular.");
          pintarAvisos();
        };
      }

      function mismaClave(sub, clave) {
        const k = sub.options && sub.options.applicationServerKey;
        if (!k) return true;
        const a = new Uint8Array(k);
        return a.length === clave.length && a.every((x, i) => x === clave[i]);
      }

      async function guardarSuscripcion(s) {
        const j = s.toJSON();
        const { data } = await db.auth.getSession();
        const email = data && data.session ? data.session.user.email : null;
        if (!email) return { ok: false, error: "no hay sesión iniciada" };
        if (!j.keys) return { ok: false, error: "registro incompleto" };
        const { error } = await db.from("suscripciones").upsert(
          {
            endpoint: j.endpoint,
            p256dh: j.keys.p256dh,
            auth: j.keys.auth,
            email: email,
            dispositivo: navigator.userAgent.slice(0, 150),
          },
          { onConflict: "endpoint" },
        );
        return error
          ? {
              ok: false,
              error: (error.code ? error.code + " " : "") + error.message,
            }
          : { ok: true };
      }

      /* =====================================================================
   Sesión
   ===================================================================== */
      document
        .querySelectorAll("[data-ir]")
        .forEach((b) => (b.onclick = () => ir(b.dataset.ir)));

      $("#form-login").onsubmit = async (e) => {
        e.preventDefault();
        const err = $("#login-error"),
          btn = $("#login-btn");
        err.hidden = true;
        btn.setAttribute("aria-busy", "true");
        const { error } = await db.auth.signInWithPassword({
          email: $("#login-correo").value.trim(),
          password: $("#login-clave").value,
        });
        btn.removeAttribute("aria-busy");
        if (error) {
          err.textContent = "Correo o contraseña incorrectos.";
          err.hidden = false;
        }
      };

      async function mostrarSegunSesion(session) {
        if (!session) {
          $("#pantalla-app").hidden = true;
          $("#pantalla-login").hidden = false;
          return;
        }
        const { data: autorizado } = await db.rpc("es_personal");
        if (!autorizado) {
          await db.auth.signOut();
          const err = $("#login-error");
          err.textContent = "Esta cuenta no tiene permiso para usar la agenda.";
          err.hidden = false;
          return;
        }
        $("#pantalla-login").hidden = true;
        $("#pantalla-app").hidden = false;
        registroSW();
        ir("agenda");
      }

      let ultimoUsuario = null;
      db.auth.onAuthStateChange((evento, session) => {
        const usuario = session ? session.user.id : null;
        if (usuario === ultimoUsuario && evento !== "INITIAL_SESSION") return;
        ultimoUsuario = usuario;
        setTimeout(() => mostrarSegunSesion(session), 0);
      });

      // Refresca las listas al volver a la app (por ejemplo, después de ir a WhatsApp)
      document.addEventListener("visibilitychange", () => {
        if (
          document.visibilityState === "visible" &&
          !$("#pantalla-app").hidden &&
          ["agenda", "pendientes", "confirmadas"].includes(E.vista)
        )
          pintar();
      });
    </script>
  </body>
</html>

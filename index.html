<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EEE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda NG">
<meta name="robots" content="noindex, nofollow">
<title>Agenda · Noemy Gavilanes Nails</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
  :root {
    --fondo: #F6EEE6;
    --tarjeta: #FFFFFF;
    --tinta: #3A2A22;
    --suave: #73604F;
    --borde: #E6D5C3;
    --bronce: #8A6445;
    --bronce-osc: #6E4C33;
    --bronce-claro: #F1E2D3;
    --oro: #C9A27E;
    --pend-fondo: #F6DCD3;
    --pend-texto: #8A3B2B;
    --pend-borde: #E3B2A2;
    --alerta: #9B2C28;
    --alerta-fondo: #FBE3E2;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; }
  button, input, select, textarea { font-family: inherit; font-size: 15px; color: var(--tinta); }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  a { color: var(--bronce); text-decoration: none; }
  :focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .contenido { flex: 1; padding: 0 20px 110px; display: flex; flex-direction: column; gap: 14px; }

  /* Cabecera */
  .cabecera { padding: 18px 20px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .marca { display: flex; align-items: center; gap: 10px; }
  .marca img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid var(--oro); }
  .marca-nombre { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.1; }
  .marca-sub { font-size: 10px; letter-spacing: 3px; font-weight: 600; color: var(--suave); }
  .btn-redondo { width: 44px; height: 44px; border-radius: 50%; background: var(--tarjeta); border: 1px solid var(--borde); display: inline-flex; align-items: center; justify-content: center; color: var(--tinta); flex-shrink: 0; }
  .barra-titulo { padding: 18px 20px 6px; display: flex; align-items: center; gap: 10px; }
  h1, h2 { font-family: var(--serif); font-weight: 700; margin: 0; }
  h1 { font-size: 27px; line-height: 1.15; }
  .barra-titulo h1 { font-size: 25px; }
  .texto-suave { color: var(--suave); font-size: 13px; margin: 0; }

  /* Tira de días */
  .tira { display: flex; gap: 6px; align-items: center; }
  .tira-dias { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .dia { height: 62px; border-radius: 14px; border: 1px solid var(--borde); background: var(--tarjeta); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; }
  .dia span:first-child { font-size: 10px; font-weight: 500; color: var(--suave); }
  .dia span:last-child { font-size: 17px; font-weight: 700; }
  .dia.hoy { border-color: var(--oro); border-width: 2px; }
  .dia.sel { background: var(--bronce); border-color: var(--bronce); color: #fff; }
  .dia.sel span:first-child { color: #fff; }
  .flecha { width: 32px; height: 62px; border-radius: 12px; border: none; background: transparent; color: var(--suave); display: flex; align-items: center; justify-content: center; padding: 0; }
  .fila-fecha { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .elegir-fecha { position: relative; font-size: 13px; font-weight: 600; color: var(--bronce); display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
  .elegir-fecha input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

  /* Resumen */
  .resumen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .resumen div { background: var(--tarjeta); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; }
  .resumen b { font-size: 19px; }
  .resumen span { font-size: 11px; color: var(--suave); }

  /* Turnos */
  .turnos { display: flex; flex-direction: column; gap: 10px; }
  .turno { display: flex; gap: 12px; align-items: stretch; width: 100%; background: none; border: none; padding: 0; text-align: left; }
  .turno-hora { width: 52px; flex-shrink: 0; display: flex; flex-direction: column; padding-top: 12px; }
  .turno-hora b { font-size: 14px; font-weight: 600; }
  .turno-hora span { font-size: 11px; color: var(--suave); }
  .turno-caja { flex: 1; min-width: 0; min-height: 60px; background: var(--tarjeta); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(58,42,34,0.07); border: 1.5px solid transparent; }
  .turno-caja.pend { border-color: var(--pend-borde); }
  .turno-caja.libre { background: transparent; box-shadow: none; border: 1.5px dashed var(--oro); justify-content: center; color: var(--bronce); font-size: 13px; font-weight: 600; }
  .turno-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .turno-info b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .turno-info span { font-size: 12px; color: var(--suave); }
  .etiqueta { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .etiqueta.conf { background: var(--bronce); color: #fff; }
  .etiqueta.pend { background: var(--pend-fondo); color: var(--pend-texto); }
  .etiqueta.vencida { background: var(--alerta-fondo); color: var(--alerta); }

  /* Tarjetas de pendientes */
  .tarjeta { background: var(--tarjeta); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 1.5px solid var(--pend-borde); }
  .tarjeta.vencida { border-color: #D9534F; }
  .tarjeta-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .tarjeta-cab div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tarjeta-cab b { font-size: 15px; font-weight: 600; }
  .tarjeta-cab span { font-size: 12px; color: var(--suave); }
  .aviso { margin: 0; font-size: 12px; color: var(--alerta); }
  .acciones { display: flex; gap: 8px; }
  .vacio { text-align: center; padding: 40px 10px; color: var(--suave); font-size: 14px; }

  /* Botones */
  .btn { min-height: 46px; border-radius: 13px; border: 1.5px solid var(--borde); background: var(--tarjeta); color: var(--tinta); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; flex: 1; text-align: center; }
  .btn-principal { background: var(--bronce); border-color: var(--bronce); color: #fff; }
  .btn-principal:hover { background: var(--bronce-osc); border-color: var(--bronce-osc); }
  .btn-borde { border-color: var(--bronce); color: var(--bronce); }
  .btn-peligro { border-color: #E7B3B1; color: var(--alerta); }
  .btn-grande { min-height: 52px; font-size: 15px; border-radius: 14px; width: 100%; }
  .btn-icono { flex: 0 0 46px; padding: 0; }
  .btn[aria-busy="true"] { opacity: 0.6; pointer-events: none; }

  /* Formulario */
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo label, .campo .rotulo { font-size: 12px; font-weight: 600; color: var(--suave); }
  .campo input, .campo textarea { height: 48px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta); padding: 0 14px; width: 100%; font-size: 16px; }
  .campo textarea { height: auto; padding: 12px 14px; resize: vertical; min-height: 70px; }
  .opciones { display: grid; gap: 8px; }
  .opciones.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opciones.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .opcion { height: 48px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta); font-size: 14px; font-weight: 600; }
  .opcion[aria-pressed="true"] { border: 1.5px solid var(--bronce); background: var(--bronce-claro); color: var(--bronce-osc); }
  .opcion:disabled { background: #F3ECE5; border-color: #EDE3D9; color: #8C7B6E; text-decoration: line-through; }
  .segmento { display: flex; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 4px; gap: 4px; }
  .segmento button { flex: 1; height: 42px; border-radius: 9px; border: none; background: transparent; color: var(--suave); font-size: 13px; font-weight: 600; }
  .segmento button[aria-pressed="true"][data-valor="pendiente"] { background: var(--pend-fondo); color: var(--pend-texto); }
  .segmento button[aria-pressed="true"][data-valor="confirmada"] { background: var(--bronce); color: #fff; }

  /* Detalle */
  .ficha { background: var(--tarjeta); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .ficha-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ficha-cab b { font-size: 19px; font-weight: 700; display: block; }
  .datos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .datos div { background: var(--fondo); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; }
  .datos span { font-size: 11px; color: var(--suave); }
  .datos b { font-size: 14px; font-weight: 600; }
  .burbuja { align-self: flex-end; max-width: 92%; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px 16px 4px 16px; padding: 12px 14px; font-size: 13px; line-height: 1.5; white-space: pre-line; }
  .columna { display: flex; flex-direction: column; gap: 8px; }

  /* Login */
  .login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 30px; padding: 32px 28px; max-width: 440px; margin: 0 auto; }
  .login-logo { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .login-logo img { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 3px solid var(--oro); box-shadow: 0 8px 24px rgba(58,42,34,0.18); }
  .login-logo span { font-size: 12px; letter-spacing: 5px; font-weight: 600; color: var(--suave); }
  .login-caja { background: var(--tarjeta); border-radius: 22px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 4px 16px rgba(58,42,34,0.07); }
  .login-caja h1 { text-align: center; font-size: 24px; }
  .login-caja .campo input { background: var(--fondo); }
  .error { color: var(--alerta); font-size: 13px; margin: 0; text-align: center; }

  /* Navegación inferior */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--tarjeta); border-top: 1px solid var(--borde); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
  .nav-in { max-width: 520px; margin: 0 auto; height: 72px; display: flex; align-items: center; justify-content: space-around; }
  .nav-btn { position: relative; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; min-height: 52px; justify-content: center; color: var(--suave); font-size: 11px; font-weight: 500; }
  .nav-btn[aria-current="page"] { color: var(--bronce); font-weight: 600; }
  .nav-mas { width: 58px; height: 58px; border-radius: 50%; background: var(--bronce); color: #fff; border: none; display: flex; align-items: center; justify-content: center; margin-top: -26px; box-shadow: 0 6px 14px rgba(138,100,69,0.35); }
  .insignia { position: absolute; top: 0; right: 14px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #A0503C; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  /* Aviso flotante */
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 40px); background: var(--tinta); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; z-index: 20; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
  .toast.mal { background: var(--alerta); }
  .cargando { text-align: center; padding: 30px; color: var(--suave); font-size: 14px; }

  @media (prefers-reduced-motion: no-preference) {
    .toast { animation: aparecer 0.2s ease-out; }
    @keyframes aparecer { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="pantalla-login" class="login" hidden>
  <div class="login-logo">
    <img src="logo.jpg" alt="Logo NG Noemy Gavilanes">
    <span>NAILS · AGENDA</span>
  </div>
  <form id="form-login" class="login-caja" novalidate>
    <h1>Entrar a la agenda</h1>
    <div class="campo">
      <label for="login-correo">Correo</label>
      <input id="login-correo" type="email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="login-clave">Contraseña</label>
      <input id="login-clave" type="password" autocomplete="current-password" required>
    </div>
    <p id="login-error" class="error" role="alert" hidden></p>
    <button id="login-btn" class="btn btn-principal btn-grande" type="submit">Entrar</button>
  </form>
  <p class="texto-suave" style="text-align:center">Solo el personal autorizado puede ver las citas y los datos de las clientas.</p>
</div>

<!-- ============ APP ============ -->
<div id="pantalla-app" class="app" hidden>
  <div id="vista"></div>
  <nav class="nav" aria-label="Navegación principal">
    <div class="nav-in">
      <button class="nav-btn" data-ir="agenda" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        Agenda
      </button>
      <button class="nav-mas" data-ir="nueva" type="button" aria-label="Nueva cita">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="nav-btn" data-ir="pendientes" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Pendientes
        <span id="insignia" class="insignia" hidden>0</span>
      </button>
    </div>
  </nav>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script>
/* =====================================================================
   CONFIGURACIÓN — cambia solo esta parte
   ===================================================================== */
const CONFIG = {
  // Supabase > Project Settings > API Keys
  SUPABASE_URL: 'https://bothajdpgwofinvetptw.supabase.co/rest/v1/',
  SUPABASE_KEY: 'sb_publishable_5JbjFoj_LS1LQ5LWcBZUsw__1C0eU_z',

  negocio: 'Noemy Gavilanes Nails',
  abono: 5,
  horasLimite: 3,          // horas que tiene la clienta para enviar el abono

  banco: 'Banco Pichincha',
  tipoCuenta: 'Ahorros',
  cuenta: '[NÚMERO DE CUENTA]',
  cedula: '[CÉDULA]',
  titular: 'Noemy Gavilanes',

  servicios: ['Uñas', 'Cejas', 'Pestañas', 'Cabello'],

  // Turnos del día: [inicio, fin] en formato 24 h
  horarios: [
    ['06:00', '07:30'], ['07:30', '09:00'], ['09:00', '10:30'],
    ['10:30', '12:00'], ['12:00', '13:30'], ['13:30', '15:00'],
    ['15:00', '16:30'], ['16:30', '18:00'], ['18:00', '19:30']
  ]
};

/* =====================================================================
   Utilidades
   ===================================================================== */
const db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const DIAS_C = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function aFecha(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function hoy() { return iso(new Date()); }
function sumarDias(s, n) { const d = aFecha(s); d.setDate(d.getDate() + n); return iso(d); }
function fechaLarga(s) { const d = aFecha(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function fechaCorta(s) { const d = aFecha(s); return DIAS_C[d.getDay()] + ' ' + d.getDate() + ' ' + MESES_C[d.getMonth()]; }
function hhmm(t) { return String(t || '').slice(0, 5); }
function hora(t) { return hhmm(t).replace(/^0/, ''); }
function finDe(inicio) { const h = CONFIG.horarios.find((x) => x[0] === inicio); return h ? h[1] : inicio; }
function transcurrido(ts) {
  const min = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 60000));
  if (min < 60) return 'Hace ' + min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 48) return 'Hace ' + h + ' h' + (m ? ' ' + m + ' min' : '');
  return 'Hace ' + Math.floor(h / 24) + ' días';
}
function vencida(c) { return (Date.now() - new Date(c.creado_en).getTime()) > CONFIG.horasLimite * 3600000; }
function primerNombre(n) { return String(n || '').trim().split(/\s+/)[0]; }

function telWa(tel) {
  let n = String(tel || '').replace(/\D/g, '');
  if (n.startsWith('0') && n.length === 10) n = '593' + n.slice(1);
  else if (n.length === 9 && n.startsWith('9')) n = '593' + n;
  return n;
}
function linkWa(tel, texto) { return 'https://wa.me/' + telWa(tel) + '?text=' + encodeURIComponent(texto); }

function msgAbono(c) {
  return 'Hola ' + primerNombre(c.cliente) + ', te separé el ' + fechaLarga(c.fecha).toLowerCase() + ' a las ' + hora(c.hora_inicio) + ' para ' + c.servicio + '.\n\n' +
    'Para confirmar tu cita, envía el abono de $' + CONFIG.abono + ' a:\n' +
    CONFIG.banco + ' · ' + CONFIG.tipoCuenta + '\nCta. ' + CONFIG.cuenta + '\nC.I. ' + CONFIG.cedula + '\nA nombre de: ' + CONFIG.titular + '\n\n' +
    'Pon tu nombre en la descripción y mándame la foto del comprobante por aquí. Tienes ' + CONFIG.horasLimite + ' horas para separar tu turno.';
}
function msgConfirmada(c) {
  return '¡' + primerNombre(c.cliente) + ', tu cita está confirmada!\n' + fechaLarga(c.fecha) + ', ' + hora(c.hora_inicio) + ' · ' + c.servicio + '.\n\n' +
    'Recuerda llegar 10 minutos antes. Si llegas 15 minutos tarde la cita se pierde y el abono no es reembolsable.\n\n¡Te esperamos! · ' + CONFIG.negocio;
}
function msgRecordatorio(c) {
  return 'Hola ' + primerNombre(c.cliente) + ', te recuerdo tu cita del ' + fechaLarga(c.fecha).toLowerCase() + ' a las ' + hora(c.hora_inicio) + ' (' + c.servicio + ').\n\n' +
    'Llega 10 minutos antes, por favor. ¡Te esperamos!';
}

let toastTimer;
function aviso(texto, mal) {
  const t = $('#toast');
  t.textContent = texto;
  t.className = 'toast' + (mal ? ' mal' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}

const ICONO_WA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.2-4.4A9 9 0 1 1 21 12z"/></svg>';
const ICONO_ATRAS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';

/* =====================================================================
   Estado
   ===================================================================== */
const E = {
  vista: 'agenda',
  fecha: hoy(),
  inicioTira: sumarDias(hoy(), -1),
  cita: null,          // cita abierta en detalle
  form: null           // datos del formulario
};

/* =====================================================================
   Datos (Supabase)
   ===================================================================== */
async function citasDelDia(fecha) {
  const { data, error } = await db.from('citas').select('*')
    .eq('fecha', fecha).in('estado', ['pendiente', 'confirmada']).order('hora_inicio');
  if (error) throw error;
  return data;
}
async function citasPendientes() {
  const { data, error } = await db.from('citas').select('*')
    .eq('estado', 'pendiente').gte('fecha', hoy()).order('fecha').order('hora_inicio');
  if (error) throw error;
  return data;
}
async function citaPorId(id) {
  const { data, error } = await db.from('citas').select('*').eq('id', id).single();
  if (error) throw error;
  return data;
}
async function actualizarInsignia() {
  try {
    const { count } = await db.from('citas').select('id', { count: 'exact', head: true })
      .eq('estado', 'pendiente').gte('fecha', hoy());
    const i = $('#insignia');
    i.textContent = count || 0;
    i.hidden = !count;
  } catch (e) { /* sin conexión: se ignora */ }
}

/* =====================================================================
   Navegación
   ===================================================================== */
function ir(vista, extra) {
  E.vista = vista;
  if (vista === 'nueva') E.form = Object.assign({ id: null, cliente: '', telefono: '', servicio: CONFIG.servicios[0], fecha: E.fecha, hora_inicio: '', estado: 'pendiente', nota: '' }, extra || {});
  document.querySelectorAll('[data-ir]').forEach((b) => b.removeAttribute('aria-current'));
  const activo = document.querySelector('.nav-btn[data-ir="' + vista + '"]');
  if (activo) activo.setAttribute('aria-current', 'page');
  window.scrollTo(0, 0);
  pintar();
  actualizarInsignia();
}

function pintar() {
  if (E.vista === 'agenda') return pintarAgenda();
  if (E.vista === 'pendientes') return pintarPendientes();
  if (E.vista === 'nueva') return pintarFormulario();
  if (E.vista === 'detalle') return pintarDetalle();
}

/* =====================================================================
   Vista: Agenda del día
   ===================================================================== */
async function pintarAgenda() {
  const v = $('#vista');
  const dias = [];
  for (let i = 0; i < 7; i++) {
    const f = sumarDias(E.inicioTira, i), d = aFecha(f);
    dias.push('<button type="button" class="dia' + (f === E.fecha ? ' sel' : '') + (f === hoy() ? ' hoy' : '') + '" data-fecha="' + f + '" aria-pressed="' + (f === E.fecha) + '" aria-label="' + fechaLarga(f) + '"><span>' + DIAS_C[d.getDay()] + '</span><span>' + d.getDate() + '</span></button>');
  }
  v.innerHTML =
    '<header class="cabecera">' +
      '<div class="marca"><img src="logo.jpg" alt="Logo NG Noemy Gavilanes"><div><div class="marca-nombre">Noemy Gavilanes</div><div class="marca-sub">NAILS · AGENDA</div></div></div>' +
      '<button type="button" class="btn-redondo" id="btn-salir" aria-label="Cerrar sesión"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg></button>' +
    '</header>' +
    '<main class="contenido">' +
      '<div class="fila-fecha"><h1>' + fechaLarga(E.fecha) + '</h1>' +
        '<label class="elegir-fecha">Otra fecha<input type="date" id="elegir-fecha" value="' + E.fecha + '" aria-label="Elegir otra fecha"></label></div>' +
      '<div class="tira">' +
        '<button type="button" class="flecha" id="tira-atras" aria-label="Semana anterior">' + ICONO_ATRAS + '</button>' +
        '<div class="tira-dias">' + dias.join('') + '</div>' +
        '<button type="button" class="flecha" id="tira-adelante" aria-label="Semana siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>' +
      '</div>' +
      '<div class="resumen" id="resumen"><div><b>–</b><span>Confirmadas</span></div><div><b>–</b><span>Pendientes</span></div><div><b>–</b><span>Libres</span></div></div>' +
      '<div class="turnos" id="turnos"><div class="cargando">Cargando citas…</div></div>' +
    '</main>';

  $('#btn-salir').onclick = async () => { await db.auth.signOut(); };
  $('#tira-atras').onclick = () => { E.inicioTira = sumarDias(E.inicioTira, -7); E.fecha = sumarDias(E.fecha, -7); pintar(); };
  $('#tira-adelante').onclick = () => { E.inicioTira = sumarDias(E.inicioTira, 7); E.fecha = sumarDias(E.fecha, 7); pintar(); };
  $('#elegir-fecha').onchange = (e) => { if (e.target.value) { E.fecha = e.target.value; E.inicioTira = sumarDias(E.fecha, -1); pintar(); } };
  v.querySelectorAll('.dia').forEach((b) => b.onclick = () => { E.fecha = b.dataset.fecha; pintar(); });

  const fechaPintada = E.fecha;
  let citas;
  try { citas = await citasDelDia(fechaPintada); }
  catch (e) { $('#turnos').innerHTML = '<div class="vacio">No se pudieron cargar las citas. Revisa tu conexión.</div>'; return; }
  if (E.vista !== 'agenda' || E.fecha !== fechaPintada) return;

  const porHora = {};
  citas.forEach((c) => { porHora[hhmm(c.hora_inicio)] = c; });
  const filas = CONFIG.horarios.map((h) => ({ ini: h[0], fin: h[1], cita: porHora[h[0]] || null }));
  citas.forEach((c) => { if (!CONFIG.horarios.some((h) => h[0] === hhmm(c.hora_inicio))) filas.push({ ini: hhmm(c.hora_inicio), fin: hhmm(c.hora_fin), cita: c }); });
  filas.sort((a, b) => a.ini.localeCompare(b.ini));

  const conf = citas.filter((c) => c.estado === 'confirmada').length;
  const pend = citas.filter((c) => c.estado === 'pendiente').length;
  const libres = filas.filter((f) => !f.cita).length;
  $('#resumen').innerHTML =
    '<div><b style="color:var(--bronce)">' + conf + '</b><span>Confirmadas</span></div>' +
    '<div><b style="color:var(--pend-texto)">' + pend + '</b><span>Pendientes</span></div>' +
    '<div><b>' + libres + '</b><span>Libres</span></div>';

  $('#turnos').innerHTML = filas.map((f) => {
    const horaHtml = '<div class="turno-hora"><b>' + hora(f.ini) + '</b><span>' + hora(f.fin) + '</span></div>';
    if (!f.cita) {
      return '<button type="button" class="turno" data-libre="' + f.ini + '">' + horaHtml +
        '<div class="turno-caja libre"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Libre · Agendar</div></button>';
    }
    const c = f.cita, esPend = c.estado === 'pendiente';
    return '<button type="button" class="turno" data-cita="' + c.id + '">' + horaHtml +
      '<div class="turno-caja' + (esPend ? ' pend' : '') + '"><div class="turno-info"><b>' + esc(c.cliente) + '</b><span>' + esc(c.servicio) + '</span></div>' +
      '<span class="etiqueta ' + (esPend ? 'pend' : 'conf') + '">' + (esPend ? 'Pendiente pago' : 'Confirmada') + '</span></div></button>';
  }).join('');

  v.querySelectorAll('[data-libre]').forEach((b) => b.onclick = () => ir('nueva', { fecha: E.fecha, hora_inicio: b.dataset.libre }));
  v.querySelectorAll('[data-cita]').forEach((b) => b.onclick = () => abrirDetalle(b.dataset.cita));
}

/* =====================================================================
   Vista: Pendientes de pago
   ===================================================================== */
async function pintarPendientes() {
  const v = $('#vista');
  v.innerHTML =
    '<header class="barra-titulo"><div><h1>Pendientes de pago</h1></div></header>' +
    '<main class="contenido"><p class="texto-suave">Citas que aún esperan el abono de $' + CONFIG.abono + '. Revisa tu app del banco antes de confirmar.</p>' +
    '<div class="columna" id="lista-pend" style="gap:14px"><div class="cargando">Cargando…</div></div></main>';

  let lista;
  try { lista = await citasPendientes(); }
  catch (e) { $('#lista-pend').innerHTML = '<div class="vacio">No se pudieron cargar. Revisa tu conexión.</div>'; return; }
  if (E.vista !== 'pendientes') return;

  if (!lista.length) { $('#lista-pend').innerHTML = '<div class="vacio">No hay citas pendientes de pago.</div>'; return; }

  $('#lista-pend').innerHTML = lista.map((c) => {
    const venc = vencida(c);
    return '<article class="tarjeta' + (venc ? ' vencida' : '') + '">' +
      '<div class="tarjeta-cab"><div><b>' + esc(c.cliente) + '</b><span>' + esc(c.servicio) + ' · ' + fechaCorta(c.fecha) + ' · ' + hora(c.hora_inicio) + '</span></div>' +
      '<span class="etiqueta ' + (venc ? 'vencida' : 'pend') + '">' + transcurrido(c.creado_en) + '</span></div>' +
      (venc ? '<p class="aviso">Pasó el tiempo límite de ' + CONFIG.horasLimite + ' horas. Puedes liberar el horario o darle más tiempo.</p>' : '') +
      '<div class="acciones">' +
        (venc
          ? '<button type="button" class="btn btn-peligro" data-liberar="' + c.id + '">Liberar horario</button>'
          : '<a class="btn btn-icono" href="' + esc(linkWa(c.telefono, msgAbono(c))) + '" target="_blank" rel="noopener" aria-label="Reenviar datos del abono por WhatsApp">' + ICONO_WA + '</a>' +
            '<button type="button" class="btn" data-ver="' + c.id + '">Ver detalle</button>') +
        '<button type="button" class="btn btn-principal" data-confirmar="' + c.id + '">Confirmar abono</button>' +
      '</div></article>';
  }).join('');

  v.querySelectorAll('[data-ver]').forEach((b) => b.onclick = () => abrirDetalle(b.dataset.ver));
  v.querySelectorAll('[data-confirmar]').forEach((b) => b.onclick = async () => {
    b.setAttribute('aria-busy', 'true');
    if (await cambiarEstado(b.dataset.confirmar, 'confirmada')) abrirDetalle(b.dataset.confirmar);
    else b.removeAttribute('aria-busy');
  });
  v.querySelectorAll('[data-liberar]').forEach((b) => b.onclick = async () => {
    if (!confirm('¿Liberar este horario? La cita quedará cancelada.')) return;
    b.setAttribute('aria-busy', 'true');
    if (await cambiarEstado(b.dataset.liberar, 'cancelada')) { aviso('Horario liberado'); pintar(); actualizarInsignia(); }
    else b.removeAttribute('aria-busy');
  });
}

async function cambiarEstado(id, estado) {
  const cambios = { estado: estado, confirmado_en: estado === 'confirmada' ? new Date().toISOString() : null };
  const { error } = await db.from('citas').update(cambios).eq('id', id);
  if (error) {
    if (error.code === '23505') aviso('Ese horario ya está ocupado por otra cita.', true);
    else aviso('No se pudo guardar. Intenta otra vez.', true);
    return false;
  }
  return true;
}

/* =====================================================================
   Vista: Nueva cita / Reprogramar
   ===================================================================== */
async function pintarFormulario() {
  const f = E.form, editando = !!f.id;
  const v = $('#vista');
  v.innerHTML =
    '<header class="barra-titulo"><button type="button" class="btn-redondo" id="btn-volver" aria-label="Volver">' + ICONO_ATRAS + '</button><h1>' + (editando ? 'Reprogramar cita' : 'Nueva cita') + '</h1></header>' +
    '<main class="contenido">' +
      '<div class="campo"><label for="f-cliente">Nombre de la clienta</label><input id="f-cliente" type="text" autocomplete="off" value="' + esc(f.cliente) + '" placeholder="Ej. Karla Vera"></div>' +
      '<div class="campo"><label for="f-tel">WhatsApp</label><input id="f-tel" type="tel" inputmode="tel" autocomplete="off" value="' + esc(f.telefono) + '" placeholder="09XX XXX XXX"></div>' +
      '<div class="campo"><span class="rotulo">Servicio</span><div class="opciones dos" id="f-servicios">' +
        CONFIG.servicios.map((s) => '<button type="button" class="opcion" data-servicio="' + esc(s) + '" aria-pressed="' + (f.servicio === s) + '">' + esc(s) + '</button>').join('') +
      '</div></div>' +
      '<div class="campo"><label for="f-fecha">Fecha</label><input id="f-fecha" type="date" value="' + f.fecha + '"></div>' +
      '<div class="campo"><span class="rotulo">Horario (los ocupados aparecen tachados)</span><div class="opciones tres" id="f-horas"><div class="cargando" style="grid-column:1/-1;padding:10px">Revisando disponibilidad…</div></div></div>' +
      (editando ? '' :
      '<div class="campo"><span class="rotulo">Estado del abono ($' + CONFIG.abono + ')</span><div class="segmento" id="f-estado">' +
        '<button type="button" data-valor="pendiente" aria-pressed="' + (f.estado === 'pendiente') + '">Pendiente de pago</button>' +
        '<button type="button" data-valor="confirmada" aria-pressed="' + (f.estado === 'confirmada') + '">Ya pagó</button>' +
      '</div></div>') +
      '<div class="campo"><label for="f-nota">Nota (opcional)</label><textarea id="f-nota" rows="2" placeholder="Diseño, color, alergias…">' + esc(f.nota) + '</textarea></div>' +
      '<button type="button" class="btn btn-principal btn-grande" id="f-guardar">' + (editando ? 'Guardar cambios' : 'Guardar cita') + '</button>' +
    '</main>';

  $('#btn-volver').onclick = () => editando ? abrirDetalle(f.id) : ir('agenda');
  $('#f-cliente').oninput = (e) => { f.cliente = e.target.value; };
  $('#f-tel').oninput = (e) => { f.telefono = e.target.value; };
  $('#f-nota').oninput = (e) => { f.nota = e.target.value; };
  v.querySelectorAll('[data-servicio]').forEach((b) => b.onclick = () => {
    f.servicio = b.dataset.servicio;
    v.querySelectorAll('[data-servicio]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  });
  if (!editando) v.querySelectorAll('#f-estado button').forEach((b) => b.onclick = () => {
    f.estado = b.dataset.valor;
    v.querySelectorAll('#f-estado button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  });
  $('#f-fecha').onchange = (e) => { f.fecha = e.target.value; f.hora_inicio = ''; pintarHoras(); };
  $('#f-guardar').onclick = guardarCita;
  pintarHoras();
}

async function pintarHoras() {
  const f = E.form, caja = $('#f-horas');
  if (!caja) return;
  if (!f.fecha) { caja.innerHTML = '<div class="texto-suave" style="grid-column:1/-1">Elige una fecha.</div>'; return; }
  const fechaConsultada = f.fecha;
  let ocupadas = {};
  try {
    (await citasDelDia(fechaConsultada)).forEach((c) => { if (c.id !== f.id) ocupadas[hhmm(c.hora_inicio)] = true; });
  } catch (e) { aviso('No se pudo revisar la disponibilidad.', true); }
  if (E.vista !== 'nueva' || E.form.fecha !== fechaConsultada) return;
  if (ocupadas[f.hora_inicio]) f.hora_inicio = '';
  caja.innerHTML = CONFIG.horarios.map((h) =>
    '<button type="button" class="opcion" data-hora="' + h[0] + '"' + (ocupadas[h[0]] ? ' disabled aria-label="' + hora(h[0]) + ' ocupado"' : '') + ' aria-pressed="' + (f.hora_inicio === h[0]) + '">' + hora(h[0]) + '</button>'
  ).join('');
  caja.querySelectorAll('[data-hora]').forEach((b) => b.onclick = () => {
    f.hora_inicio = b.dataset.hora;
    caja.querySelectorAll('[data-hora]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  });
}

async function guardarCita() {
  const f = E.form, btn = $('#f-guardar');
  if (!f.cliente.trim()) return aviso('Escribe el nombre de la clienta.', true);
  if (!f.fecha) return aviso('Elige la fecha.', true);
  if (!f.hora_inicio) return aviso('Elige un horario libre.', true);

  const datos = {
    cliente: f.cliente.trim(),
    telefono: f.telefono.trim() || null,
    servicio: f.servicio,
    fecha: f.fecha,
    hora_inicio: f.hora_inicio,
    hora_fin: finDe(f.hora_inicio),
    nota: f.nota.trim() || null
  };
  btn.setAttribute('aria-busy', 'true');
  let res;
  if (f.id) {
    res = await db.from('citas').update(datos).eq('id', f.id).select().single();
  } else {
    datos.estado = f.estado;
    if (f.estado === 'confirmada') datos.confirmado_en = new Date().toISOString();
    res = await db.from('citas').insert(datos).select().single();
  }
  btn.removeAttribute('aria-busy');

  if (res.error) {
    if (res.error.code === '23505') { aviso('Ese horario se acaba de ocupar. Elige otro.', true); pintarHoras(); }
    else aviso('No se pudo guardar. Intenta otra vez.', true);
    return;
  }
  E.fecha = f.fecha;
  E.inicioTira = sumarDias(f.fecha, -1);
  aviso(f.id ? 'Cambios guardados' : 'Cita guardada. Ahora envíale el mensaje por WhatsApp.');
  E.cita = res.data;
  ir('detalle');
}

/* =====================================================================
   Vista: Detalle de cita
   ===================================================================== */
async function abrirDetalle(id) {
  try { E.cita = await citaPorId(id); }
  catch (e) { return aviso('No se pudo abrir la cita.', true); }
  ir('detalle');
}

function pintarDetalle() {
  const c = E.cita, v = $('#vista');
  if (!c) return ir('agenda');
  const esPend = c.estado === 'pendiente';
  const texto = esPend ? msgAbono(c) : msgConfirmada(c);
  const pasada = c.fecha < hoy();

  v.innerHTML =
    '<header class="barra-titulo"><button type="button" class="btn-redondo" id="btn-volver" aria-label="Volver a la agenda">' + ICONO_ATRAS + '</button><h1>Detalle de cita</h1></header>' +
    '<main class="contenido">' +
      '<section class="ficha">' +
        '<div class="ficha-cab"><div><b>' + esc(c.cliente) + '</b><span class="texto-suave">' + esc(c.telefono || 'Sin teléfono') + '</span></div>' +
          '<span class="etiqueta ' + (esPend ? 'pend' : 'conf') + '">' + (esPend ? 'Pendiente de pago' : 'Confirmada') + '</span></div>' +
        '<div class="datos">' +
          '<div><span>Fecha</span><b>' + fechaCorta(c.fecha) + '</b></div>' +
          '<div><span>Horario</span><b>' + hora(c.hora_inicio) + ' – ' + hora(c.hora_fin) + '</b></div>' +
          '<div><span>Servicio</span><b>' + esc(c.servicio) + '</b></div>' +
          '<div><span>Abono</span><b>$' + CONFIG.abono + (esPend ? ' · por recibir' : ' · recibido') + '</b></div>' +
        '</div>' +
        (c.nota ? '<p class="texto-suave">Nota: ' + esc(c.nota) + '</p>' : '') +
        (esPend ? '<p class="texto-suave">Reservada ' + transcurrido(c.creado_en).toLowerCase() + '.</p>' : '') +
      '</section>' +
      '<section class="columna">' +
        '<span class="texto-suave" style="font-weight:600;font-size:12px">' + (esPend ? 'Mensaje con los datos del abono' : 'Mensaje de confirmación') + '</span>' +
        '<div class="burbuja">' + esc(texto) + '</div>' +
      '</section>' +
      '<section class="columna">' +
        (esPend
          ? '<button type="button" class="btn btn-principal btn-grande" id="d-confirmar">Confirmar abono recibido</button>'
          : '<button type="button" class="btn btn-borde btn-grande" id="d-pendiente">Volver a pendiente</button>') +
        (c.telefono
          ? '<a class="btn btn-grande" href="' + esc(linkWa(c.telefono, texto)) + '" target="_blank" rel="noopener">' + ICONO_WA + (esPend ? 'Enviar datos del abono' : 'Enviar confirmación') + '</a>' +
            (!esPend && !pasada ? '<a class="btn btn-grande" href="' + esc(linkWa(c.telefono, msgRecordatorio(c))) + '" target="_blank" rel="noopener">' + ICONO_WA + 'Enviar recordatorio</a>' : '')
          : '<p class="texto-suave">Agrega un número de WhatsApp (en Reprogramar) para enviarle mensajes.</p>') +
        '<div class="acciones">' +
          '<button type="button" class="btn" id="d-editar">Reprogramar</button>' +
          '<button type="button" class="btn btn-peligro" id="d-cancelar">Cancelar cita</button>' +
        '</div>' +
      '</section>' +
    '</main>';

  $('#btn-volver').onclick = () => { E.fecha = c.fecha; E.inicioTira = sumarDias(c.fecha, -1); ir('agenda'); };
  const recargar = async () => { try { E.cita = await citaPorId(c.id); } catch (e) {} pintarDetalle(); actualizarInsignia(); };
  if (esPend) $('#d-confirmar').onclick = async (e) => {
    const b = e.currentTarget;
    b.setAttribute('aria-busy', 'true');
    if (await cambiarEstado(c.id, 'confirmada')) { aviso('¡Cita confirmada! Envíale la confirmación.'); recargar(); }
    else b.removeAttribute('aria-busy');
  };
  else $('#d-pendiente').onclick = async () => { if (await cambiarEstado(c.id, 'pendiente')) recargar(); };
  $('#d-editar').onclick = () => ir('nueva', { id: c.id, cliente: c.cliente, telefono: c.telefono || '', servicio: c.servicio, fecha: c.fecha, hora_inicio: hhmm(c.hora_inicio), estado: c.estado, nota: c.nota || '' });
  $('#d-cancelar').onclick = async () => {
    if (!confirm('¿Cancelar la cita de ' + c.cliente + '? El horario quedará libre.')) return;
    if (await cambiarEstado(c.id, 'cancelada')) { aviso('Cita cancelada'); E.fecha = c.fecha; ir('agenda'); }
  };
}

/* =====================================================================
   Sesión
   ===================================================================== */
document.querySelectorAll('[data-ir]').forEach((b) => b.onclick = () => ir(b.dataset.ir));

$('#form-login').onsubmit = async (e) => {
  e.preventDefault();
  const err = $('#login-error'), btn = $('#login-btn');
  err.hidden = true;
  btn.setAttribute('aria-busy', 'true');
  const { error } = await db.auth.signInWithPassword({ email: $('#login-correo').value.trim(), password: $('#login-clave').value });
  btn.removeAttribute('aria-busy');
  if (error) { err.textContent = 'Correo o contraseña incorrectos.'; err.hidden = false; }
};

async function mostrarSegunSesion(session) {
  if (!session) {
    $('#pantalla-app').hidden = true;
    $('#pantalla-login').hidden = false;
    return;
  }
  const { data: autorizado } = await db.rpc('es_personal');
  if (!autorizado) {
    await db.auth.signOut();
    const err = $('#login-error');
    err.textContent = 'Esta cuenta no tiene permiso para usar la agenda.';
    err.hidden = false;
    return;
  }
  $('#pantalla-login').hidden = true;
  $('#pantalla-app').hidden = false;
  ir('agenda');
}

let ultimoUsuario = null;
db.auth.onAuthStateChange((evento, session) => {
  const usuario = session ? session.user.id : null;
  if (usuario === ultimoUsuario && evento !== 'INITIAL_SESSION') return;
  ultimoUsuario = usuario;
  setTimeout(() => mostrarSegunSesion(session), 0);
});

// Refresca la vista al volver a la app (por ejemplo, después de ir a WhatsApp)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('#pantalla-app').hidden && (E.vista === 'agenda' || E.vista === 'pendientes')) pintar();
});
</script>

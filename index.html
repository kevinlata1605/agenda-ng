<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5EFE8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Agenda" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Agenda</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icono-192.png" />
    <link rel="apple-touch-icon" href="icono-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <style>
      :root {
        --fondo: #f6eee6;
        --tarjeta: #ffffff;
        --tinta: #3a2a22;
        --suave: #73604f;
        --borde: #e6d5c3;
        --bronce: #8a6445;
        --bronce-osc: #6e4c33;
        --bronce-claro: #f1e2d3;
        --oro: #c9a27e;
        --pend-fondo: #f6dcd3;
        --pend-texto: #8a3b2b;
        --pend-borde: #e3b2a2;
        --alerta: #9b2c28;
        --alerta-fondo: #fbe3e2;
        --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --sans:
          "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        margin: 0;
        background: var(--fondo);
        color: var(--tinta);
        font-family: var(--sans);
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100vh;
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 15px;
        color: var(--tinta);
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      a {
        color: var(--bronce);
        text-decoration: none;
      }
      :focus-visible {
        outline: 3px solid var(--oro);
        outline-offset: 2px;
      }
      img {
        max-width: 100%;
      }
      [hidden] {
        display: none !important;
      }

      .app {
        max-width: 520px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .contenido {
        flex: 1;
        padding: 0 20px 110px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* Cabecera */
      .cabecera {
        padding: 18px 20px 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .marca {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .marca img {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--oro);
      }
      .marca-nombre {
        font-family: var(--serif);
        font-size: 22px;
        font-weight: 600;
        line-height: 1.1;
      }
      .marca-sub {
        font-size: 10px;
        letter-spacing: 3px;
        font-weight: 600;
        color: var(--suave);
      }
      .btn-redondo {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--tarjeta);
        border: 1px solid var(--borde);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--tinta);
        flex-shrink: 0;
      }
      .barra-titulo {
        padding: 18px 20px 6px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h1,
      h2 {
        font-family: var(--serif);
        font-weight: 700;
        margin: 0;
      }
      h1 {
        font-size: 27px;
        line-height: 1.15;
      }
      .barra-titulo h1 {
        font-size: 25px;
      }
      .texto-suave {
        color: var(--suave);
        font-size: 13px;
        margin: 0;
      }

      /* Tira de días */
      .tira {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .tira-dias {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
      }
      .dia {
        height: 62px;
        border-radius: 14px;
        border: 1px solid var(--borde);
        background: var(--tarjeta);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        padding: 0;
      }
      .dia span:first-child {
        font-size: 10px;
        font-weight: 500;
        color: var(--suave);
      }
      .dia span:last-child {
        font-size: 17px;
        font-weight: 700;
      }
      .dia.hoy {
        border-color: var(--oro);
        border-width: 2px;
      }
      .dia.sel {
        background: var(--bronce);
        border-color: var(--bronce);
        color: #fff;
      }
      .dia.sel span:first-child {
        color: #fff;
      }
      .flecha {
        width: 32px;
        height: 62px;
        border-radius: 12px;
        border: none;
        background: transparent;
        color: var(--suave);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .fila-fecha {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .elegir-fecha {
        position: relative;
        font-size: 13px;
        font-weight: 600;
        color: var(--bronce);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 44px;
      }
      .elegir-fecha input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        cursor: pointer;
      }

      /* Resumen */
      .resumen {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .resumen div {
        background: var(--tarjeta);
        border-radius: 12px;
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
      }
      .resumen b {
        font-size: 19px;
      }
      .resumen span {
        font-size: 11px;
        color: var(--suave);
      }

      /* Turnos */
      .turnos {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .turno {
        display: flex;
        gap: 12px;
        align-items: stretch;
        width: 100%;
        background: none;
        border: none;
        padding: 0;
        text-align: left;
      }
      .turno-hora {
        width: 52px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        padding-top: 12px;
      }
      .turno-hora b {
        font-size: 14px;
        font-weight: 600;
      }
      .turno-hora span {
        font-size: 11px;
        color: var(--suave);
      }
      .turno-caja {
        flex: 1;
        min-width: 0;
        min-height: 60px;
        background: var(--tarjeta);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        box-shadow: 0 1px 2px rgba(58, 42, 34, 0.07);
        border: 1.5px solid transparent;
      }
      .turno-caja.pend {
        border-color: var(--pend-borde);
      }
      .turno-caja.libre {
        background: transparent;
        box-shadow: none;
        border: 1.5px dashed var(--oro);
        justify-content: center;
        color: var(--bronce);
        font-size: 13px;
        font-weight: 600;
      }
      .turno-caja.pasado {
        background: transparent;
        box-shadow: none;
        border: 1.5px dashed var(--borde);
        justify-content: center;
        color: var(--suave);
        font-size: 13px;
        font-weight: 500;
      }
      .turno.pasado .turno-hora {
        opacity: 0.6;
      }
      .turno-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .turno-info b {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .turno-info span {
        font-size: 12px;
        color: var(--suave);
      }
      .etiqueta {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .etiqueta.conf {
        background: var(--bronce);
        color: #fff;
      }
      .etiqueta.pend {
        background: var(--pend-fondo);
        color: var(--pend-texto);
      }
      .etiqueta.vencida {
        background: var(--alerta-fondo);
        color: var(--alerta);
      }

      /* Tarjetas de pendientes */
      .tarjeta {
        background: var(--tarjeta);
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border: 1.5px solid var(--pend-borde);
      }
      .tarjeta.vencida {
        border-color: #d9534f;
      }
      .tarjeta-cab {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .tarjeta-cab div {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .tarjeta-cab b {
        font-size: 15px;
        font-weight: 600;
      }
      .tarjeta-cab span {
        font-size: 12px;
        color: var(--suave);
      }
      .aviso {
        margin: 0;
        font-size: 12px;
        color: var(--alerta);
      }
      .acciones {
        display: flex;
        gap: 8px;
      }
      .vacio {
        text-align: center;
        padding: 40px 10px;
        color: var(--suave);
        font-size: 14px;
      }

      /* Botones */
      .btn {
        min-height: 46px;
        border-radius: 13px;
        border: 1.5px solid var(--borde);
        background: var(--tarjeta);
        color: var(--tinta);
        font-size: 14px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 14px;
        flex: 1;
        text-align: center;
      }
      .btn-principal {
        background: var(--bronce);
        border-color: var(--bronce);
        color: #fff;
      }
      .btn-principal:hover {
        background: var(--bronce-osc);
        border-color: var(--bronce-osc);
      }
      .btn-borde {
        border-color: var(--bronce);
        color: var(--bronce);
      }
      .btn-peligro {
        border-color: #e7b3b1;
        color: var(--alerta);
      }
      .btn-grande {
        min-height: 52px;
        font-size: 15px;
        border-radius: 14px;
        width: 100%;
      }
      .btn-icono {
        flex: 0 0 46px;
        padding: 0;
      }
      .btn[aria-busy="true"] {
        opacity: 0.6;
        pointer-events: none;
      }

      /* Formulario */
      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .campo label,
      .campo .rotulo {
        font-size: 12px;
        font-weight: 600;
        color: var(--suave);
      }
      .campo input,
      .campo textarea {
        height: 48px;
        border-radius: 12px;
        border: 1px solid var(--borde);
        background: var(--tarjeta);
        padding: 0 14px;
        width: 100%;
        font-size: 16px;
      }
      .campo textarea {
        height: auto;
        padding: 12px 14px;
        resize: vertical;
        min-height: 70px;
      }
      .opciones {
        display: grid;
        gap: 8px;
      }
      .opciones.dos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .opciones.tres {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .opcion {
        height: 48px;
        border-radius: 12px;
        border: 1px solid var(--borde);
        background: var(--tarjeta);
        font-size: 14px;
        font-weight: 600;
      }
      .opcion[aria-pressed="true"] {
        border: 1.5px solid var(--bronce);
        background: var(--bronce-claro);
        color: var(--bronce-osc);
      }
      .opcion:disabled {
        background: #f3ece5;
        border-color: #ede3d9;
        color: #8c7b6e;
        text-decoration: line-through;
      }
      .segmento {
        display: flex;
        background: var(--tarjeta);
        border: 1px solid var(--borde);
        border-radius: 12px;
        padding: 4px;
        gap: 4px;
      }
      .segmento button {
        flex: 1;
        height: 42px;
        border-radius: 9px;
        border: none;
        background: transparent;
        color: var(--suave);
        font-size: 13px;
        font-weight: 600;
      }
      .segmento button[aria-pressed="true"][data-valor="pendiente"] {
        background: var(--pend-fondo);
        color: var(--pend-texto);
      }
      .segmento button[aria-pressed="true"][data-valor="confirmada"] {
        background: var(--bronce);
        color: #fff;
      }

      /* Detalle */
      .ficha {
        background: var(--tarjeta);
        border-radius: 20px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .ficha-cab {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .ficha-cab b {
        font-size: 19px;
        font-weight: 700;
        display: block;
      }
      .datos {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .datos div {
        background: var(--fondo);
        border-radius: 12px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
      }
      .datos span {
        font-size: 11px;
        color: var(--suave);
      }
      .datos b {
        font-size: 14px;
        font-weight: 600;
      }
      .burbuja {
        align-self: flex-end;
        max-width: 92%;
        background: var(--tarjeta);
        border: 1px solid var(--borde);
        border-radius: 16px 16px 4px 16px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-line;
      }
      .columna {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Login */
      .login {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
        padding: 32px 28px;
        max-width: 440px;
        margin: 0 auto;
      }
      .login-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .login-logo img {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--oro);
        box-shadow: 0 8px 24px rgba(58, 42, 34, 0.18);
      }
      .login-logo span {
        font-size: 12px;
        letter-spacing: 5px;
        font-weight: 600;
        color: var(--suave);
      }
      .login-caja {
        background: var(--tarjeta);
        border-radius: 22px;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: 0 4px 16px rgba(58, 42, 34, 0.07);
      }
      .login-caja h1 {
        text-align: center;
        font-size: 24px;
      }
      .login-caja .campo input {
        background: var(--fondo);
      }
      .error {
        color: var(--alerta);
        font-size: 13px;
        margin: 0;
        text-align: center;
      }

      /* Servicios con subopciones */
      .servicios {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .grupo-serv {
        border: 1px solid var(--borde);
        border-radius: 12px;
        background: var(--tarjeta);
      }
      .grupo-serv summary {
        list-style: none;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .grupo-serv summary::-webkit-details-marker {
        display: none;
      }
      .grupo-serv summary svg {
        transition: transform 0.15s;
        color: var(--suave);
      }
      .grupo-serv[open] summary svg {
        transform: rotate(180deg);
      }
      .grupo-serv .opciones {
        padding: 0 10px 10px;
      }
      .cuenta {
        font-size: 11px;
        font-weight: 600;
        background: var(--bronce);
        color: #fff;
        border-radius: 999px;
        padding: 2px 8px;
      }
      .opcion[aria-pressed="true"]::before {
        content: "✓ ";
      }
      .opcion.corto:disabled {
        text-decoration: none;
      }
      .nota-turno {
        font-size: 13px;
        color: var(--bronce-osc);
        background: var(--bronce-claro);
        border-radius: 10px;
        padding: 10px 12px;
        margin: 0;
      }

      /* Listas por fecha y turnos del detalle */
      .encabezado-fecha {
        font-family: var(--serif);
        font-size: 20px;
        font-weight: 700;
        margin: 8px 0 0;
      }
      .tarjeta.conf {
        border-color: var(--borde);
      }
      .turnos-grupo {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .turnos-grupo div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        background: var(--fondo);
        border-radius: 10px;
        padding: 8px 12px;
      }
      .turnos-grupo b {
        font-weight: 600;
      }

      /* Navegación inferior */
      .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--tarjeta);
        border-top: 1px solid var(--borde);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        z-index: 10;
      }
      .nav-in {
        max-width: 520px;
        margin: 0 auto;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-around;
      }
      .nav-btn {
        position: relative;
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 64px;
        min-height: 52px;
        justify-content: center;
        color: var(--suave);
        font-size: 11px;
        font-weight: 500;
      }
      .nav-btn[aria-current="page"] {
        color: var(--bronce);
        font-weight: 600;
      }
      .nav-mas {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--bronce);
        color: #fff;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: -26px;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      }
      .insignia {
        position: absolute;
        top: 0;
        right: 14px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: #a0503c;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Aviso flotante */
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(92px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        max-width: calc(100% - 40px);
        background: var(--tinta);
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 14px;
        z-index: 20;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
      }
      .toast.mal {
        background: var(--alerta);
      }
      .cargando {
        text-align: center;
        padding: 30px;
        color: var(--suave);
        font-size: 14px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .toast {
          animation: aparecer 0.2s ease-out;
        }
        @keyframes aparecer {
          from {
            opacity: 0;
            transform: translate(-50%, 8px);
          }
          to {
            opacity: 1;
            transform: translate(-50%, 0);
          }
        }
      }
    </style>
  </head>
  <body>
    <!-- ============ LOGIN ============ -->
    <div id="pantalla-login" class="login" hidden>
      <div class="login-logo">
        <img src="logo.jpg" alt="" id="login-logo" />
        <span id="login-sub"></span>
      </div>
      <form id="form-login" class="login-caja" novalidate>
        <h1>Entrar a la agenda</h1>
        <div class="campo">
          <label for="login-correo">Correo</label>
          <input
            id="login-correo"
            type="email"
            autocomplete="username"
            required
          />
        </div>
        <div class="campo">
          <label for="login-clave">Contraseña</label>
          <input
            id="login-clave"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>

    <script src="config.js"></script>
    <script>
      /* =====================================================================
   Marca: aplica nombre y colores de config.js
   ===================================================================== */
      (function aplicarMarca() {
        const mapa = {
          fondo: "--fondo",
          tarjeta: "--tarjeta",
          tinta: "--tinta",
          suave: "--suave",
          borde: "--borde",
          principal: "--bronce",
          principalOscuro: "--bronce-osc",
          principalClaro: "--bronce-claro",
          acento: "--oro",
        };
        const raiz = document.documentElement.style;
        Object.keys(mapa).forEach((k) => {
          if (CONFIG.colores && CONFIG.colores[k])
            raiz.setProperty(mapa[k], CONFIG.colores[k]);
        });
        document.title = "Agenda · " + CONFIG.negocio;
        const meta = (n) => document.querySelector('meta[name="' + n + '"]');
        if (CONFIG.colores && CONFIG.colores.fondo)
          meta("theme-color").setAttribute("content", CONFIG.colores.fondo);
        meta("apple-mobile-web-app-title").setAttribute(
          "content",
          CONFIG.marca.tituloApp || "Agenda",
        );
        document.getElementById("login-logo").alt = "Logo " + CONFIG.negocio;
        document.getElementById("login-sub").textContent =
          CONFIG.marca.subLogin || "AGENDA";
      })();

      /* =====================================================================
   Utilidades
   ===================================================================== */
      const db = window.supabase.createClient(
        CONFIG.SUPABASE_URL,
        CONFIG.SUPABASE_KEY,
      );
      const $ = (s) => document.querySelector(s);
      const DIAS = [
        "Domingo",
        "Lunes",
        "Martes",
        "Miércoles",
        "Jueves",
        "Viernes",
        "Sábado",
      ];
      const DIAS_C = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
      const MESES = [
        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre",
      ];
      const MESES_C = [
        "ene",
        "feb",
        "mar",
        "abr",
        "may",
        "jun",
        "jul",
        "ago",
        "sep",
        "oct",
        "nov",
        "dic",
      ];

      // Lista plana de "unidades" de servicio: cada una ocupa un turno
      const UNIDADES = [];
      CONFIG.servicios.forEach((s) => {
        if (s.opciones)
          s.opciones.forEach((o) => UNIDADES.push(s.nombre + " · " + o));
        else UNIDADES.push(s.nombre);
      });

      function esc(t) {
        return String(t ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function iso(d) {
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }
      function aFecha(s) {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function hoy() {
        return iso(new Date());
      }
      function sumarDias(s, n) {
        const d = aFecha(s);
        d.setDate(d.getDate() + n);
        return iso(d);
      }
      function fechaLarga(s) {
        const d = aFecha(s);
        return (
          DIAS[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()]
        );
      }
      function fechaCorta(s) {
        const d = aFecha(s);
        return (
          DIAS_C[d.getDay()] + " " + d.getDate() + " " + MESES_C[d.getMonth()]
        );
      }
      function fechaTitulo(s) {
        if (s === hoy()) return "Hoy · " + fechaLarga(s);
        if (s === sumarDias(hoy(), 1)) return "Mañana · " + fechaLarga(s);
        return fechaLarga(s);
      }
      function hhmm(t) {
        return String(t || "").slice(0, 5);
      }
      function hora(t) {
        return hhmm(t).replace(/^0/, "");
      }
      function minutos(t) {
        const [h, m] = hhmm(t).split(":").map(Number);
        return h * 60 + m;
      }
      // Hora local del celular. Un turno "ya pasó" cuando TERMINÓ; el turno en curso
      // (por ejemplo 16:30–18:00 a las 17:00) todavía se puede agendar.
      function minutosAhora() {
        const n = new Date();
        return n.getHours() * 60 + n.getMinutes();
      }
      function yaPaso(fecha, horaInicio) {
        if (fecha < hoy()) return true;
        if (fecha > hoy()) return false;
        const turno = CONFIG.horarios.find((h) => h[0] === hhmm(horaInicio));
        return minutos(turno ? turno[1] : horaInicio) <= minutosAhora();
      }
      function duracionTexto(ini, fin) {
        const m = minutos(fin) - minutos(ini),
          h = Math.floor(m / 60),
          r = m % 60;
        return (h ? h + " h" : "") + (r ? (h ? " " : "") + r + " min" : "");
      }
      function transcurrido(ts) {
        const min = Math.max(
          0,
          Math.round((Date.now() - new Date(ts).getTime()) / 60000),
        );
        if (min < 60) return "Hace " + min + " min";
        const h = Math.floor(min / 60),
          m = min % 60;
        if (h < 48) return "Hace " + h + " h" + (m ? " " + m + " min" : "");
        return "Hace " + Math.floor(h / 24) + " días";
      }
      function primerNombre(n) {
        return String(n || "")
          .trim()
          .split(/\s+/)[0];
      }
      function unirLista(a) {
        return a.length <= 1
          ? a[0] || ""
          : a.slice(0, -1).join(", ") + " y " + a[a.length - 1];
      }
      function nuevoId() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
          const r = (Math.random() * 16) | 0;
          return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
        });
      }

      function telWa(tel) {
        let n = String(tel || "").replace(/\D/g, "");
        if (n.startsWith("0") && n.length === 10) n = "593" + n.slice(1);
        else if (n.length === 9 && n.startsWith("9")) n = "593" + n;
        return n;
      }
      function linkWa(tel, texto) {
        return (
          "https://wa.me/" + telWa(tel) + "?text=" + encodeURIComponent(texto)
        );
      }

      /* ---------- Reservas (grupos de turnos) ---------- */
      function armarGrupo(filas) {
        filas = filas
          .slice()
          .sort((a, b) =>
            hhmm(a.hora_inicio).localeCompare(hhmm(b.hora_inicio)),
          );
        const p = filas[0],
          u = filas[filas.length - 1];
        return {
          grupo: p.grupo || p.id,
          filas: filas,
          cliente: p.cliente,
          telefono: p.telefono,
          fecha: p.fecha,
          inicio: hhmm(p.hora_inicio),
          fin: hhmm(u.hora_fin),
          servicios: [].concat(
            ...filas.map((f) => separarServicios(f.servicio)),
          ),
          estado: p.estado,
          nota: p.nota,
          creado_en: p.creado_en,
          confirmado_en: p.confirmado_en,
        };
      }
      function agrupar(filas) {
        const mapa = new Map();
        filas.forEach((f) => {
          const g = f.grupo || f.id;
          if (!mapa.has(g)) mapa.set(g, []);
          mapa.get(g).push(f);
        });
        return Array.from(mapa.values())
          .map(armarGrupo)
          .sort((a, b) =>
            (a.fecha + a.inicio).localeCompare(b.fecha + b.inicio),
          );
      }
      function vencida(g) {
        return (
          Date.now() - new Date(g.creado_en).getTime() >
          CONFIG.horasLimite * 3600000
        );
      }
      // Máximo de turnos por cita (config.js → maxTurnos). Si no se define, 2.
      function maxTurnos() {
        return Math.max(1, CONFIG.maxTurnos || 2);
      }
      // Un turno puede llevar varios servicios unidos con " + "
      function separarServicios(t) {
        return String(t || "")
          .split(" + ")
          .filter(Boolean);
      }
      function textoTurno(t) {
        return serviciosTexto({ servicios: separarServicios(t) });
      }
      // Reparte los servicios elegidos en n turnos (los primeros turnos llevan uno más)
      function repartir(unidades, n) {
        const grupos = [],
          base = Math.floor(unidades.length / n),
          extra = unidades.length % n;
        let k = 0;
        for (let i = 0; i < n; i++) {
          const cant = base + (i < extra ? 1 : 0);
          grupos.push(unidades.slice(k, k + cant));
          k += cant;
        }
        return grupos;
      }
      function serviciosTexto(g) {
        // "Uñas · Manos" + "Uñas · Pies" + "Cejas"  ->  "Uñas (manos y pies) y Cejas"
        const orden = [],
          subs = {};
        g.servicios.forEach((s) => {
          const [padre, sub] = s.split(" · ");
          if (!(padre in subs)) {
            subs[padre] = [];
            orden.push(padre);
          }
          if (sub) subs[padre].push(sub.toLowerCase());
        });
        return unirLista(
          orden.map((p) =>
            subs[p].length ? p + " (" + unirLista(subs[p]) + ")" : p,
          ),
        );
      }

      /* ---------- Mensajes de WhatsApp ---------- */
      function msgAbono(g) {
        return (
          "Hola " +
          primerNombre(g.cliente) +
          ", te separé el " +
          fechaLarga(g.fecha).toLowerCase() +
          " de " +
          hora(g.inicio) +
          " a " +
          hora(g.fin) +
          " para " +
          serviciosTexto(g) +
          ".\n\n" +
          "Para confirmar tu cita, envía el abono de $" +
          CONFIG.abono +
          " a:\n" +
          CONFIG.banco +
          " · " +
          CONFIG.tipoCuenta +
          "\nCta. " +
          CONFIG.cuenta +
          "\nC.I. " +
          CONFIG.cedula +
          (CONFIG.titular ? "\nA nombre de: " + CONFIG.titular : "") +
          "\n\n" +
          "Pon tu nombre en la descripción y mándame la foto del comprobante por aquí. Tienes " +
          CONFIG.horasLimite +
          " horas para separar tu turno."
        );
      }
      function msgConfirmada(g) {
        return (
          "¡" +
          primerNombre(g.cliente) +
          ", tu cita está confirmada!\n" +
          fechaLarga(g.fecha) +
          ", de " +
          hora(g.inicio) +
          " a " +
          hora(g.fin) +
          "\n" +
          serviciosTexto(g) +
          ".\n\n" +
          "Recuerda llegar " +
          CONFIG.reglas.llegarAntes +
          " minutos antes. Si llegas " +
          CONFIG.reglas.tolerancia +
          " minutos tarde la cita se pierde y el abono no es reembolsable.\n\n¡Te esperamos! · " +
          CONFIG.negocio
        );
      }
      function msgRecordatorio(g) {
        return (
          "Hola " +
          primerNombre(g.cliente) +
          ", te recuerdo tu cita del " +
          fechaLarga(g.fecha).toLowerCase() +
          " a las " +
          hora(g.inicio) +
          " (" +
          serviciosTexto(g) +
          ").\n\n" +
          "Llega " +
          CONFIG.reglas.llegarAntes +
          " minutos antes, por favor. ¡Te esperamos!"
        );
      }

      let toastTimer;
      function aviso(texto, mal) {
        const t = $("#toast");
        t.textContent = texto;
        t.className = "toast" + (mal ? " mal" : "");
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          t.hidden = true;
        }, 3500);
      }

      const ICONO_WA =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.2-4.4A9 9 0 1 1 21 12z"/></svg>';
      const ICONO_ATRAS =
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
      const ICONO_BAJAR =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

      /* =====================================================================
   Estado
   ===================================================================== */
      const E = {
        vista: "agenda",
        fecha: hoy(),
        inicioTira: sumarDias(hoy(), -1),
        reserva: null, // reserva (grupo) abierta en detalle
        form: null,
      };

      /* =====================================================================
   Datos (Supabase)
   ===================================================================== */
      async function citasDelDia(fecha) {
        const { data, error } = await db
          .from("citas")
          .select("*")
          .eq("fecha", fecha)
          .in("estado", ["pendiente", "confirmada"])
          .order("hora_inicio");
        if (error) throw error;
        return data;
      }
      async function reservasPorEstado(estado) {
        const { data, error } = await db
          .from("citas")
          .select("*")
          .eq("estado", estado)
          .gte("fecha", hoy())
          .order("fecha")
          .order("hora_inicio");
        if (error) throw error;
        return agrupar(data);
      }
      async function reservaPorGrupo(grupo) {
        const { data, error } = await db
          .from("citas")
          .select("*")
          .eq("grupo", grupo)
          .order("hora_inicio");
        if (error) throw error;
        if (!data.length) throw new Error("No encontrada");
        const activas = data.filter((f) => f.estado !== "cancelada");
        return armarGrupo(activas.length ? activas : data);
      }
      async function actualizarInsignia() {
        try {
          const { data } = await db
            .from("citas")
            .select("grupo")
            .eq("estado", "pendiente")
            .gte("fecha", hoy());
          const n = new Set((data || []).map((f) => f.grupo)).size;
          const i = $("#insignia");
          i.textContent = n;
          i.hidden = !n;
        } catch (e) {
          /* sin conexión: se ignora */
        }
      }
      async function cambiarEstado(grupo, estado) {
        const cambios = {
          estado: estado,
          confirmado_en:
            estado === "confirmada" ? new Date().toISOString() : null,
        };
        const { error } = await db
          .from("citas")
          .update(cambios)
          .eq("grupo", grupo)
          .in("estado", ["pendiente", "confirmada"]);
        if (error) {
          if (error.code === "23505")
            aviso("Ese horario ya está ocupado por otra cita.", true);
          else aviso("No se pudo guardar. Intenta otra vez.", true);
          return false;
        }
        return true;
      }

      /* =====================================================================
   Navegación
   ===================================================================== */
      function ir(vista, extra) {
        E.vista = vista;
        if (vista === "nueva") {
          E.form = Object.assign(
            {
              grupo: null,
              cliente: "",
              telefono: "",
              unidades: [],
              fecha: E.fecha < hoy() ? hoy() : E.fecha,
              hora_inicio: "",
              estado: "pendiente",
              nota: "",
              original: null,
            },
            extra || {},
          );
          E.form.ocupadas = null;
          E.form.ocupadasFecha = null;
        }
        document
          .querySelectorAll("[data-ir]")
          .forEach((b) => b.removeAttribute("aria-current"));
        const activo = document.querySelector(
          '.nav-btn[data-ir="' + vista + '"]',
        );
        if (activo) activo.setAttribute("aria-current", "page");
        window.scrollTo(0, 0);
        pintar();
        actualizarInsignia();
      }

      function pintar() {
        if (E.vista === "agenda") return pintarAgenda();
        if (E.vista === "pendientes") return pintarPendientes();
        if (E.vista === "confirmadas") return pintarConfirmadas();
        if (E.vista === "nueva") return pintarFormulario();
        if (E.vista === "detalle") return pintarDetalle();
        if (E.vista === "avisos") return pintarAvisos();
      }

      /* =====================================================================
   Vista: Agenda del día
   ===================================================================== */
      async function pintarAgenda() {
        const v = $("#vista");
        const dias = [];
        for (let i = 0; i < 7; i++) {
          const f = sumarDias(E.inicioTira, i),
            d = aFecha(f);
          dias.push(
            '<button type="button" class="dia' +
              (f === E.fecha ? " sel" : "") +
              (f === hoy() ? " hoy" : "") +
              '" data-fecha="' +
              f +
              '" aria-pressed="' +
              (f === E.fecha) +
              '" aria-label="' +
              fechaLarga(f) +
              '"><span>' +
              DIAS_C[d.getDay()] +
              "</span><span>" +
              d.getDate() +
              "</span></button>",
          );
        }
        v.innerHTML =
          '<header class="cabecera">' +
          '<div class="marca"><img src="icono.jpg" alt="Logo ' +
          esc(CONFIG.negocio) +
          '"><div><div class="marca-nombre">' +
          esc(CONFIG.marca.nombre) +
          '</div><div class="marca-sub">' +
          esc(CONFIG.marca.sub) +
          "</div></div></div>" +
          '<div style="display:flex;gap:8px">' +
          '<button type="button" class="btn-redondo" id="btn-avisos" aria-label="Avisos de citas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>' +
          '<button type="button" class="btn-redondo" id="btn-salir" aria-label="Cerrar sesión"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg></button></div>' +
          "</header>" +
          '<main class="contenido">' +
          '<div class="fila-fecha"><h1>' +
          fechaLarga(E.fecha) +
          "</h1>" +
          '<label class="elegir-fecha">Otra fecha<input type="date" id="elegir-fecha" value="' +
          E.fecha +
          '" aria-label="Elegir otra fecha"></label></div>' +
          '<div class="tira">' +
          '<button type="button" class="flecha" id="tira-atras" aria-label="Semana anterior">' +
          ICONO_ATRAS +
          "</button>" +
          '<div class="tira-dias">' +
          dias.join("") +
          "</div>" +
          '<button type="button" class="flecha" id="tira-adelante" aria-label="Semana siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>' +
          "</div>" +
          '<div class="resumen" id="resumen"><div><b>–</b><span>Confirmadas</span></div><div><b>–</b><span>Pendientes</span></div><div><b>–</b><span>Libres</span></div></div>' +
          '<div class="turnos" id="turnos"><div class="cargando">Cargando citas…</div></div>' +
          "</main>";

        $("#btn-avisos").onclick = () => ir("avisos");
        $("#btn-salir").onclick = async () => {
          if (confirm("¿Cerrar sesión?")) await db.auth.signOut();
        };
        $("#tira-atras").onclick = () => {
          E.inicioTira = sumarDias(E.inicioTira, -7);
          E.fecha = sumarDias(E.fecha, -7);
          pintar();
        };
        $("#tira-adelante").onclick = () => {
          E.inicioTira = sumarDias(E.inicioTira, 7);
          E.fecha = sumarDias(E.fecha, 7);
          pintar();
        };
        $("#elegir-fecha").onchange = (e) => {
          if (e.target.value) {
            E.fecha = e.target.value;
            E.inicioTira = sumarDias(E.fecha, -1);
            pintar();
          }
        };
        v.querySelectorAll(".dia").forEach(
          (b) =>
            (b.onclick = () => {
              E.fecha = b.dataset.fecha;
              pintar();
            }),
        );

        const fechaPintada = E.fecha;
        let citas;
        try {
          citas = await citasDelDia(fechaPintada);
        } catch (e) {
          $("#turnos").innerHTML =
            '<div class="vacio">No se pudieron cargar las citas. Revisa tu conexión.</div>';
          return;
        }
        if (E.vista !== "agenda" || E.fecha !== fechaPintada) return;

        // Posición de cada turno dentro de su reserva (ej. 1/2, 2/2)
        const reservas = agrupar(citas),
          posicion = {};
        reservas.forEach((g) =>
          g.filas.forEach((f, i) => {
            posicion[f.id] =
              g.filas.length > 1 ? i + 1 + "/" + g.filas.length : "";
          }),
        );

        const porHora = {};
        citas.forEach((c) => {
          porHora[hhmm(c.hora_inicio)] = c;
        });
        const filas = CONFIG.horarios.map((h) => ({
          ini: h[0],
          fin: h[1],
          cita: porHora[h[0]] || null,
        }));
        citas.forEach((c) => {
          if (!CONFIG.horarios.some((h) => h[0] === hhmm(c.hora_inicio)))
            filas.push({
              ini: hhmm(c.hora_inicio),
              fin: hhmm(c.hora_fin),
              cita: c,
            });
        });
        filas.sort((a, b) => a.ini.localeCompare(b.ini));

        const conf = reservas.filter((g) => g.estado === "confirmada").length;
        const pend = reservas.filter((g) => g.estado === "pendiente").length;
        const libres = filas.filter((f) => !f.cita).length;
        $("#resumen").innerHTML =
          '<div><b style="color:var(--bronce)">' +
          conf +
          "</b><span>Confirmadas</span></div>" +
          '<div><b style="color:var(--pend-texto)">' +
          pend +
          "</b><span>Pendientes</span></div>" +
          "<div><b>" +
          libres +
          "</b><span>Turnos libres</span></div>";

        $("#turnos").innerHTML = filas
          .map((f) => {
            const horaHtml =
              '<div class="turno-hora"><b>' +
              hora(f.ini) +
              "</b><span>" +
              hora(f.fin) +
              "</span></div>";
            if (!f.cita) {
              if (yaPaso(E.fecha, f.ini)) {
                return (
                  '<div class="turno pasado">' +
                  horaHtml +
                  '<div class="turno-caja pasado">Hora pasada</div></div>'
                );
              }
              return (
                '<button type="button" class="turno" data-libre="' +
                f.ini +
                '">' +
                horaHtml +
                '<div class="turno-caja libre"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Libre · Agendar</div></button>'
              );
            }
            const c = f.cita,
              esPend = c.estado === "pendiente",
              pos = posicion[c.id];
            return (
              '<button type="button" class="turno" data-grupo="' +
              esc(c.grupo || c.id) +
              '">' +
              horaHtml +
              '<div class="turno-caja' +
              (esPend ? " pend" : "") +
              '"><div class="turno-info"><b>' +
              esc(c.cliente) +
              "</b><span>" +
              esc(textoTurno(c.servicio)) +
              (pos ? " · turno " + pos : "") +
              "</span></div>" +
              '<span class="etiqueta ' +
              (esPend ? "pend" : "conf") +
              '">' +
              (esPend ? "Pendiente pago" : "Confirmada") +
              "</span></div></button>"
            );
          })
          .join("");

        v.querySelectorAll("[data-libre]").forEach(
          (b) =>
            (b.onclick = () =>
              ir("nueva", { fecha: E.fecha, hora_inicio: b.dataset.libre })),
        );
        v.querySelectorAll("[data-grupo]").forEach(
          (b) => (b.onclick = () => abrirDetalle(b.dataset.grupo)),
        );
      }

      /* =====================================================================
   Vista: Pendientes de pago
   ===================================================================== */

        }

        if (!lista.length) {
          $("#lista").innerHTML =
            '<div class="vacio">No hay reservas pendientes de pago.</div>';

        }

        $("#lista").innerHTML = lista

              '">' +
              '<div class="tarjeta-cab"><div><b>' +

              "</b><span>" +
              esc(serviciosTexto(g)) +
              "</span><span>" +
              fechaCorta(g.fecha) +
              " · " +
              hora(g.inicio) +
              " – " +
              hora(g.fin) +
              "</span></div>" +
              '<span class="etiqueta ' +
              (venc ? "vencida" : "pend") +
              '">' +
              transcurrido(g.creado_en) +
              "</span></div>" +
              (venc
                ? '<p class="aviso">Pasó el tiempo límite de ' +
                  CONFIG.horasLimite +
                  " horas. Puedes liberar el horario o darle más tiempo.</p>"
                : "") +
              '<div class="acciones">' +
              (venc
                ? '<button type="button" class="btn btn-peligro" data-liberar="' +
                  esc(g.grupo) +
                  '">Liberar horario</button>'
                : (g.telefono
                    ? '<a class="btn btn-icono" href="' +
                      esc(linkWa(g.telefono, msgAbono(g))) +

                      ICONO_WA +
                      "</a>"
                    : "") +
                  '<button type="button" class="btn" data-ver="' +

              esc(g.grupo) +
              '">Confirmar abono</button>' +
              "</div></article>"
            );

        v.querySelectorAll("[data-ver]").forEach(
          (b) => (b.onclick = () => abrirDetalle(b.dataset.ver)),
        );
        v.querySelectorAll("[data-confirmar]").forEach(
          (b) =>
            (b.onclick = async () => {
              b.setAttribute("aria-busy", "true");
              if (await cambiarEstado(b.dataset.confirmar, "confirmada")) {
                aviso("¡Cita confirmada! Envíale la confirmación.");
                abrirDetalle(b.dataset.confirmar);
              } else b.removeAttribute("aria-busy");
            }),
        );
        v.querySelectorAll("[data-liberar]").forEach(
          (b) =>
            (b.onclick = async () => {
              if (
                !confirm(
                  "¿Liberar estos horarios? La reserva quedará cancelada.",
                )
              )
                return;
              b.setAttribute("aria-busy", "true");
              if (await cambiarEstado(b.dataset.liberar, "cancelada")) {
                aviso("Horario liberado");
                pintar();
                actualizarInsignia();
              } else b.removeAttribute("aria-busy");
            }),
        );

      /* =====================================================================
   Vista: Nueva cita / Reprogramar

          editando = !!f.grupo;

            .map((s) => {

                  ">" +

        v.innerHTML =

          "</button><h1>" +
          (editando ? "Reprogramar cita" : "Nueva cita") +
          "</h1></header>" +
          '<main class="contenido">' +
          '<div class="campo"><label for="f-cliente">Nombre de la clienta</label><input id="f-cliente" type="text" autocomplete="off" value="' +
          esc(f.cliente) +
          '" placeholder="Ej. Karla Vera"></div>' +
          '<div class="campo"><label for="f-tel">WhatsApp</label><input id="f-tel" type="tel" inputmode="tel" autocomplete="off" value="' +
          esc(f.telefono) +
          '" placeholder="09XX XXX XXX"></div>' +
          '<div class="campo"><span class="rotulo">Servicios (puedes elegir varios; máximo ' +
          maxTurnos() +
          (maxTurnos() === 1 ? " turno" : " turnos") +
          ' por cita)</span><div class="servicios">' +
          htmlServicios +
          "</div></div>" +
          '<div class="campo"><label for="f-fecha">Fecha</label><input id="f-fecha" type="date" min="' +
          hoy() +
          '" value="' +
          f.fecha +
          '"></div>' +
          '<div class="campo"><span class="rotulo" id="f-horas-rotulo">Hora de inicio</span><div class="opciones tres" id="f-horas"><div class="cargando" style="grid-column:1/-1;padding:10px">Revisando disponibilidad…</div></div>' +
          '<p class="nota-turno" id="f-resumen" hidden></p></div>' +
          (editando
            ? ""
            : '<div class="campo"><span class="rotulo">Estado del abono ($' +

              ')</span><div class="segmento" id="f-estado">' +
              '<button type="button" data-valor="pendiente" aria-pressed="' +
              (f.estado === "pendiente") +
              '">Pendiente de pago</button>' +
              '<button type="button" data-valor="confirmada" aria-pressed="' +
              (f.estado === "confirmada") +
              '">Ya pagó</button>' +
              "</div></div>") +
          '<div class="campo"><label for="f-nota">Nota (opcional)</label><textarea id="f-nota" rows="2" placeholder="Diseño, color, alergias…">' +
          esc(f.nota) +
          "</textarea></div>" +
          '<button type="button" class="btn btn-principal btn-grande" id="f-guardar">' +
